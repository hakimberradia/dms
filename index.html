function globalSearch(q){q=(q||'').trim();if(q)go('search',{q})}
function pgSearch(){const q=VIEW.q||'';const m=s=>String(s||'').includes(q);
  const G=[
   ['المهام',visibleTasks().concat(DB.tasks.filter(t=>t.status==='arch'&&roleIn(t.committee))).filter(t=>m(t.title)||m(t.notes)||(t.comments||[]).some(c=>m(c.text))).map(t=>({t:t.title,s:comm(t.committee).name+' · '+STATUS[t.status],on:`openTask('${t.id}')`}))],
   ['المؤشرات',DB.kpis.filter(k=>roleIn(k.committee)&&(m(k.name)||m(k.plan)||m(k.standard))).map(k=>({t:k.name,s:comm(k.committee).name,on:`openKpi('${k.id}')`}))],
   ['الوثائق',DB.files.filter(f=>roleIn(f.committee)&&(m(f.name)||m(f.note))).map(f=>({t:f.name,s:(f.cat||'')+' · إصدار '+(f.ver||1),on:`downloadFile('${f.id}')`}))],
   ['الزيارات',roleInType('receptions')?DB.visits.filter(v=>m(v.title)||m(v.guest)||m(v.agenda)).map(v=>({t:v.title,s:fmtD(v.date),on:`openVisit('${v.id}')`})):[]],
   ['قياسات المخرجات',roleInType('quality')?DB.clo.filter(c=>m(c.courseName)||m(c.code)||m(c.instructor)||(c.students||[]).some(s=>m(s.name)||m(s.sid))).map(c=>({t:c.courseName+' '+c.code,s:c.instructor+' · '+c.semester,on:`go('clo',{clo:'${c.id}'})`})):[]],
   ['الأحداث',DB.events.filter(e=>(!e.committee||roleIn(e.committee))&&(m(e.title)||m(e.notes))).map(e=>({t:e.title,s:fmtD(e.date),on:`openEvent('${e.id}')`}))],
   ['خطة التشغيل',DB.goals.filter(g=>m(g.title)).map(g=>({t:g.title,s:'هدف',on:`go('plan')`})).concat(DB.initiatives.filter(i=>m(i.title)).map(i=>({t:i.title,s:'مبادرة · '+comm(i.committee).name,on:`go('plan')`})))],
   ['المستخدمون',(isAdmin()||ME.head)?DB.users.filter(u=>m(u.name)||m(u.username)).map(u=>({t:u.name,s:u.username,on:`openUser('${u.id}')`})):[]],
   ['الأنظمة',systems().filter(x=>roleIn(x.committee)&&(m(x.name)||m(x.desc))).map(x=>({t:x.name,s:x.ver,on:sysOpen(x)}))]
  ].filter(g=>g[1].length);
  let h=`<div class="filters"><input id="sq" value="${esc(q)}" onkeydown="if(event.key==='Enter')globalSearch(this.value)" style="flex:1"><button class="btn primary" onclick="globalSearch($('#sq').value)">بحث</button></div>`;
  if(!q)return h;if(!G.length)return h+`<div class="panel"><div class="empty">لا توجد نتائج لـ «${esc(q)}».</div></div>`;
  return h+G.map(([n,l])=>`<div class="panel"><h3>${n} (${l.length})</h3><div class="body"><ul class="list-plain">${l.slice(0,30).map(r=>`<li style="cursor:pointer" onclick="${r.on.replace(/"/g,'&quot;')}"><span style="flex:1">${esc(r.t)}<div class="small muted">${esc(r.s)}</div></span></li>`).join('')}</ul></div></div>`).join('');
}

function openTpl(id){const t=id?DB.templates.find(x=>x.id===id):{title:'',committee:DB.committees.find(c=>isChair(c.id)).id,offset:0,dur:7,ev:false,priority:'m',notes:'',active:true};

function generateTerm(){const S=DB.settings,term=val('tgT'),start=val('tgS');if(!start){alert('حدد تاريخ بداية الفصل.');return}
  S.termStarts[term]=start;const add=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return ymd(x)};let n=0;
  DB.templates.filter(tp=>tp.active&&isChair(tp.committee)&&!DB.tasks.some(t=>t.tpl===tp.id&&t.term===term)).forEach(tp=>{
    const ch=chairsOf(tp.committee).filter(u=>(user(u).memberships||{})[tp.committee]==='chair')[0]||ME.id;
    const s=add(start,tp.offset);DB.tasks.push({id:uid('t'),tpl:tp.id,term,title:tp.title,committee:tp.committee,assignee:ch,start:s,end:add(s,tp.dur),status:'not',progress:0,priority:tp.priority,notes:tp.notes||'',ev:tp.ev,files:[],comments:[{by:ME.id,at:nowISO(),text:'أُنشئت تلقائيًا من قالب متكرر'}],createdBy:ME.id,createdAt:nowISO(),updatedAt:nowISO(),updatedBy:ME.id});
    notify([ch],'مهمة جديدة من قوالب الفصل: '+tp.title,null);n++});
  audit('ولّد مهام الفصل',term,n+' مهمة');save();refresh();toast(n?'أُنشئت '+n+' مهمة':'كل مهام القوالب موجودة لهذا الفصل')}

/* ---------- خطة التشغيل السنوية ---------- */
function taskProg(t){return t.status==='done'||t.status==='arch'?100:(+t.progress||0)}
function initProgress(i){const ts=DB.tasks.filter(t=>t.initiative===i.id);return ts.length?Math.round(ts.reduce((a,t)=>a+taskProg(t),0)/ts.length):0}
function goalProgress(g){const is=DB.initiatives.filter(i=>i.goal===g.id);return is.length?Math.round(is.reduce((a,i)=>a+initProgress(i),0)/is.length):0}

function pgArchive(){
  const S=DB.settings,term=VIEW.term||'';
  const list=DB.tasks.filter(t=>t.status==='arch'&&roleIn(t.committee)&&(!term||t.term===term));
  const oldDone=DB.tasks.filter(t=>t.status==='done'&&t.term&&t.term!==S.term&&isChair(t.committee)).length;
  let h=`<div class="filters"><select onchange="go('archive',{term:this.value})">${opt(S.terms,term,'كل الفصول')}</select><span style="flex:1" class="small muted">المهام المؤرشفة لا تدخل في إحصاءات الإنجاز الحالية، وتبقى قابلة للبحث والاسترجاع.</span>
    ${oldDone?`<button class="btn primary" onclick="archiveOld()">أرشفة ${oldDone} مهمة مكتملة من الفصول السابقة</button>`:''}</div>`;
  const byTerm={};DB.tasks.filter(t=>roleIn(t.committee)).forEach(t=>{const k=t.term||'—';byTerm[k]=byTerm[k]||{n:0,d:0,late:0,days:[]};byTerm[k].n++;if(t.status==='done'||t.status==='arch'){byTerm[k].d++;if(t.approvedAt&&t.createdAt)byTerm[k].days.push(daysBetween(t.createdAt.slice(0,10),t.approvedAt.slice(0,10)))}});
  h+=`<div class="panel"><h3>ملخص الفصول</h3><div class="tbl-wrap"><table class="t"><tr><th>الفصل</th><th>المهام</th><th>المنجز</th><th>نسبة الإنجاز</th><th>متوسط أيام الإغلاق</th></tr>${Object.entries(byTerm).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.d}</td><td>${Math.round(v.d/v.n*100)}%</td><td>${v.days.length?r1(v.days.reduce((a,b)=>a+b,0)/v.days.length):'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">لا توجد بيانات.</td></tr>'}</table></div></div>`;
  h+=list.length?`<div class="panel tbl-wrap"><table class="t"><tr><th>المهمة</th><th>اللجنة</th><th>الفصل</th><th>المسؤول</th><th>اعتُمدت</th><th>الأدلة</th></tr>${list.map(t=>`<tr class="click" onclick="openTask('${t.id}')"><td>${esc(t.title)}</td><td class="small">${esc(comm(t.committee).name)}</td><td class="small">${esc(t.term||'')}</td><td class="small">${esc(uname(t.assignee))}</td><td class="date">${fmtD(t.approvedAt)}</td><td>${(t.files||[]).length}</td></tr>`).join('')}</table></div>`:`<div class="panel"><div class="empty">لا توجد مهام مؤرشفة${term?' لهذا الفصل':''}.</div></div>`;
  return h;
}
function archiveOld(){const S=DB.settings;let n=0;DB.tasks.forEach(t=>{if(t.status==='done'&&t.term&&t.term!==S.term&&isChair(t.committee)){t.status='arch';t.archivedAt=nowISO();n++}});audit('أرشف مهام الفصول السابقة','المهام',n+' مهمة');save();refresh();toast('أُرشفت '+n+' مهمة')}

const _pgHead=pgHead;pgHead=function(){
  let h=_pgHead();if(!canHeadDash())return h;
  const done=DB.tasks.filter(t=>(t.status==='done'||t.status==='arch')&&t.approvedAt&&t.createdAt);
  const closeDays=done.map(t=>daysBetween(t.createdAt.slice(0,10),t.approvedAt.slice(0,10)));
  const avgClose=closeDays.length?r1(closeDays.reduce((a,b)=>a+b,0)/closeDays.length):null;
  const byC=DB.committees.map(c=>{const d=done.filter(t=>t.committee===c.id).map(t=>daysBetween(t.createdAt.slice(0,10),t.approvedAt.slice(0,10)));return {label:c.name,value:d.length?d.reduce((a,b)=>a+b,0)/d.length:0,color:c.hex}}).filter(x=>x.value);
  const returns=DB.tasks.reduce((a,t)=>a+(t.returns||0),0);
  const kNo=DB.kpis.filter(k=>k.actual!==''&&k.actual!=null&&!kpiMet(k));
  const cloLow=DB.clo.flatMap(m=>{const c=cloCalc(m);return c.res.map((r,j)=>r&&c.n&&r.avg<m.target?{m,j,r}:null).filter(Boolean)});
  const terms={};DB.tasks.forEach(t=>{const k=t.term||'—';terms[k]=terms[k]||{n:0,d:0};terms[k].n++;if(t.status==='done'||t.status==='arch')terms[k].d++});
  const tl=Object.keys(terms).slice(-4);
  const ex=`<div class="grid2"><div class="panel"><h3>سرعة الإغلاق<span class="sp"></span><span class="small muted">${avgClose!=null?'المتوسط '+avgClose+' يوم':''} · ${returns} طلب تعديل</span></h3><div class="body">${hbars(byC,{unit:' يوم'})}</div></div>
   <div class="panel"><h3>مقارنة الفصول</h3><div class="body">${tl.length?columns(tl,[{name:'المهام',color:'#AEB8B4',values:tl.map(k=>terms[k].n)},{name:'المنجز',color:'var(--ledger)',values:tl.map(k=>terms[k].d)}]):'<div class="small muted">لا توجد بيانات.</div>'}</div></div></div>
   <div class="grid2"><div class="panel"><h3>مؤشرات غير محققة (${kNo.length})</h3><div class="body">${kNo.length?`<ul class="list-plain">${kNo.map(k=>`<li style="cursor:pointer" onclick="openKpi('${k.id}')"><span style="flex:1">${esc(k.name)}<div class="small muted">${esc(comm(k.committee).name)} · الفعلي ${esc(k.actual)}${esc(k.unit||'')} / المستهدف ${esc(k.target)}${esc(k.unit||'')}${k.plan?' · لها خطة تحسين':' · <b class="bad">بدون خطة تحسين</b>'}</div></span></li>`).join('')}</ul>`:'<div class="small muted">كل المؤشرات المقاسة محققة.</div>'}</div></div>
   <div class="panel"><h3>مخرجات تعلم تحت المستهدف (${cloLow.length})</h3><div class="body">${cloLow.length?`<ul class="list-plain">${cloLow.map(x=>`<li style="cursor:pointer" onclick="go('clo',{clo:'${x.m.id}'})"><span style="flex:1">${esc(x.m.courseName)} – المخرج ${x.j+1}<div class="small muted">${esc(x.m.instructor)} · ${esc(x.m.section)} · ${r1(x.r.avg)}% من ${x.m.target}%</div></span></li>`).join('')}</ul>`:'<div class="small muted">لا توجد مخرجات تحت المستهدف.</div>'}</div></div></div>`;
  return h.replace(/<\/div>$/,ex+'</div>');
};

function pickScope(s){LG_SCOPE=s;const p=$('#lgPanel');p.style.setProperty('--c',scopeColor(s));

async function doLogin(e){e.preventDefault();
  const un=$('#lgUser').value.trim(),pw=$('#lgPass').value,s=LG_SCOPE;if(!s)return;
  const u=DB.users.find(x=>x.username.toLowerCase()===un.toLowerCase());
  const lk=lockInfo(un);if(lk.until&&lk.until>Date.now()){$('#lgErr').textContent='أُوقفت محاولات الدخول مؤقتًا بعد 5 محاولات خاطئة. حاول بعد '+Math.ceil((lk.until-Date.now())/60000)+' دقيقة.';return}
  $('#lgErr').textContent='جارٍ التحقق…';
  if(!u||u.active===false||!(await verifyPass(u,pw))){const n=(lk.n||0)+1;setLock(un,n>=5?{n:0,until:Date.now()+5*60000}:{n});$('#lgErr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة.'+(n>=3&&n<5?' تبقّت '+(5-n)+' محاولة.':'');return}
  setLock(un,null);
  if(!scopeAllowed(u,s)){$('#lgErr').textContent=s==='owner'?'هذا الحساب ليس حساب المالك.':s==='head'?'هذا الحساب لا يملك صلاحية رئيس قسم.':s==='college'?'هذا الحساب ليس حساب العميد أو أحد الوكلاء.':'هذا الحساب ليس عضوًا في '+comm(s).name+'. تواصل مع مالك النظام لإضافتك.';return}
  ME=u;SCOPE=s;localStorage.setItem('dms-last-user',u.username);sessionStorage.setItem('dms-session',JSON.stringify({u:u.id,scope:s}));
  audit('دخول',scopeName(s),'',DB.committees.some(c=>c.id===s)?s:'');save();$('#lgPass').value='';$('#lgErr').textContent='';closeLgPanel();enter();
}

<script>

 survey:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 17v-3M12 17v-6M15 17v-4"/>',

/* حذف لجنة (المالك): تُحذف نسخها في كل الأقسام بشرط ألا يكون فيها عمل مسجل */
function delCommittee(cid){
  if(!isAdmin())return;const c=comm(cid);if(!c||!c.id)return;const t=c.type||c.id;
  const group=DB.committees.filter(x=>(x.type||x.id)===t),ids=new Set(group.map(x=>x.id)),nm=c.baseName||c.name;

    const cur=Array.isArray(S.appComm[k])?S.appComm[k]:[defaultComm(k)];
    if(cur.some(x=>x===t||ids.has(x)))S.appComm[k]=cur.filter(x=>x!==t&&!ids.has(x))});
  audit('حذف لجنة',nm,group.length+' نسخة');save();go('home');toast('حُذفت اللجنة')}
/* عنوان الموقع: يُبنى من اسم القسم والكلية في «الإعدادات العامة» */
/* المسميات التي يعدّلها المالك من «الإعدادات العامة ← الهوية والمسميات» */
function LBL(k,d){const L=(DB&&DB.settings&&DB.settings.labels)||{};const v=L[k];return (v!=null&&String(v).trim())?String(v).trim():d}
function siteTitleAuto(){const S=DB.settings,many=(DB.departments||[]).length>1;return many?'أقسام '+S.college:S.dept+(S.college?' ب'+S.college:'')}

function deptOf(cid){const c=((DB&&DB.committees)||[]).find(x=>x.id===cid);return c?(c.dept||''):''}
function deptById(id){return ((DB&&DB.departments)||[]).find(d=>d.id===id)||null}
function deptName(id){const d=deptById(id);return d?d.name:'—'}
function primaryDept(){return (DB&&DB.settings&&DB.settings.primaryDept)||(((DB&&DB.departments)||[])[0]||{}).id||''}

  const r=roleIn(SCOPE);return r==='chair'?'رئيس اللجنة':r==='viewer'?'مطّلع (قراءة فقط)':r==='head'?(ME.collegeRole?collegeRoleName(ME):'رئيس '+deptName(ME.headDept)):'عضو اللجنة'}
/* القسم الحالي: من اللجنة التي دخل منها العضو، أو قسم رئيس القسم، أو القسم الذي اختاره المالك أو العميد */
function curDept(){
  if(SCOPE&&!['owner','head','college'].includes(SCOPE)){const d=deptOf(SCOPE);if(d)return d}
  if(ME&&ME.headDept&&!isAdmin()&&!ME.collegeRole)return ME.headDept;
  return (SEL_DEPT&&deptById(SEL_DEPT))?SEL_DEPT:primaryDept()}

/* ترحيل البيانات وإنشاء لجان الأقسام — آمن للتكرار ومعرّفات النسخ ثابتة فلا تتكرر عند الدمج بين الأجهزة */
function ensureDepts(D){
  if(!D||!D.settings||!Array.isArray(D.committees))return D;
  D.departments=Array.isArray(D.departments)?D.departments:[];
  const S=D.settings;let pid=S.primaryDept;
  if(!pid||!D.departments.some(d=>d.id===pid)){
    const ex=D.departments.find(d=>d.name===S.dept);
    if(ex)pid=ex.id;else{pid='d1';if(!D.departments.some(d=>d.id==='d1'))D.departments.unshift({id:'d1',name:S.dept||'القسم',note:''})}

#login.l2{--lp:#6A3FB5;--lp-d:#4A2A8C;--lp-l:#8F6BD3;--lp-bg:#F7F4FC;--lp-line:#E3DAF3;--lp-ink:#1E1240;background:var(--lp-bg);font-family:'L2Taj','Tajawal','Segoe UI',Tahoma,sans-serif}
#login.l2 *,#login.l2 button,#login.l2 input,#login.l2 h1,#login.l2 h2,#login.l2 .tile,#login.l2 .tile *{font-family:'L2Taj','Tajawal','Segoe UI',Tahoma,sans-serif!important;letter-spacing:0}
#login.l2 #lgTitle,#login.l2 .tile-n{font-weight:800!important}
#login.l2 .lhead{display:none}
/* الشريط العلوي */
.l2-bar{background:linear-gradient(90deg,var(--lp-d),var(--lp) 55%,var(--lp-l));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 28px 12px;position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(74,42,140,.25)}
.l2-brand{display:flex;align-items:center;gap:12px;min-width:0}
.l2-logo{background:#fff;border-radius:8px;padding:4px;display:grid;place-items:center;flex:0 0 auto}
.l2-logo img{height:54px;width:auto;display:block}
.l2-uni{display:flex;flex-direction:column;line-height:1.25}
.l2-uni b{font-size:21px;font-weight:800}.l2-uni small{font-size:15px;opacity:.92;direction:ltr;text-align:right}
.l2-act{display:flex;gap:10px;align-items:center;position:relative}
.l2-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);border-radius:22px;padding:8px 18px;font-size:15px;font-weight:700;color:#fff}
.l2-btn:hover,.l2-btn:focus-visible{background:rgba(255,255,255,.2)}
.l2-menu{border-radius:12px;padding:8px 12px;font-size:20px;line-height:1}
.l2-dd{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:#fff;color:var(--lp-ink);border-radius:14px;box-shadow:0 18px 40px rgba(30,18,64,.25);min-width:270px;padding:8px;z-index:40}
.l2-dd.hidden{display:none}
.l2-dd button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14.5px}
.l2-dd button:hover,.l2-dd button:focus-visible{background:#F1ECFA}
.l2-dd hr{border:0;border-top:1px solid var(--lp-line);margin:6px 4px}
.l2-dd .small{padding:4px 12px 6px;display:block}
/* البطل */
.l2-hero,.l2-search,.l2-allh{width:100%;box-sizing:border-box}
.l2-hero{max-width:1180px;margin:0 auto;padding:34px 28px 10px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.l2-hero-t{flex:1 1 auto;text-align:center;min-width:0}
.l2-org{display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:800;color:var(--lp-ink)}
.l2-org i{display:block;height:2px;width:70px;background:var(--lp);border-radius:2px;margin-top:22px}
#login.l2 #lgTitle{font-size:46px;font-weight:800;color:var(--lp-ink);margin:14px 0 10px;line-height:1.3;font-family:inherit}
#login.l2 #lgSub{font-size:18px;color:#4E4370;margin:0 auto;max-width:640px;line-height:1.8;opacity:1}
.l2-art{flex:0 0 230px}
.l2-art svg{width:100%;height:auto;display:block}
/* البحث */
.l2-search{max-width:1180px;margin:18px auto 0;padding:0 28px}
.l2-search-in{display:flex;align-items:center;background:#fff;border:1.5px solid var(--lp-line);border-radius:40px;padding:6px;box-shadow:0 6px 18px rgba(74,42,140,.08)}
.l2-search input{all:unset;flex:1;padding:10px 16px;font-size:16.5px;color:var(--lp-ink);min-width:0}
.l2-search input::placeholder{color:#8B82A6}
.l2-search-go{all:unset;cursor:pointer;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--lp),var(--lp-d));display:grid;place-items:center;flex:0 0 auto}
.l2-allh{max-width:1180px;margin:30px auto 0;padding:0 28px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--lp-ink)}
.l2-allh span{border-bottom:3px solid var(--lp);padding-bottom:6px}
.l2-none{grid-column:1/-1;text-align:center;color:#6B6290;padding:30px 0;font-size:15px}
/* البطاقات */
#login.l2 .tiles{max-width:1180px;padding:18px 28px 36px;gap:26px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
#login.l2 .land-h{font-size:17px;color:var(--lp-d);font-weight:800;margin:14px 0 2px;display:flex;align-items:center;gap:8px}
#login.l2 .land-h::before{content:'';width:6px;height:20px;border-radius:3px;background:var(--lp)}
#login.l2 .land-h .small{color:#7A7096!important}
#login.l2 .tile{border:1px solid var(--lp-line);border-radius:18px;box-shadow:0 8px 22px rgba(74,42,140,.08);overflow:visible;background:#fff}
#login.l2 .tile:hover{border-color:var(--lp-l);box-shadow:0 16px 34px rgba(74,42,140,.18)}
#login.l2 .tile:focus-visible{outline:3px solid var(--lp-l)}
#login.l2 .tile-top{height:96px;border-radius:18px 18px 0 0;background:linear-gradient(120deg,#8B63D6,#6A3FB5)!important;background-image:linear-gradient(120deg,#8B63D6,#6A3FB5)!important}
#login.l2 .tile:nth-of-type(3n+2) .tile-top{background-image:linear-gradient(120deg,#6A44B8,#4A2A8C)!important}
#login.l2 .tile:nth-of-type(3n) .tile-top{background-image:linear-gradient(120deg,#9C7BE0,#7448C2)!important}
#login.l2 .tile-ic{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);width:100px;height:100px;background:linear-gradient(150deg,#9874DD,#6A3FB5);border:5px solid #fff;box-shadow:0 8px 20px rgba(74,42,140,.3)}
#login.l2 .tile-ic svg{width:48px;height:48px}
#login.l2 .tile-b{padding:58px 18px 20px;align-items:center;text-align:center;gap:8px}
#login.l2 .tile-n{font-size:22px;font-weight:800;color:var(--lp-ink)}
#login.l2 .tile-d{font-size:14.5px;color:#4E4370;line-height:1.7}
#login.l2 .tile-chips{justify-content:center}
#login.l2 .tile-chips i{background:#F1ECFA;color:var(--lp-d)}
#login.l2 .tile-go{align-self:center;margin-top:auto;background:linear-gradient(90deg,var(--lp-d),var(--lp));border-radius:12px;padding:9px 40px;font-size:17px;font-weight:700;box-shadow:0 6px 14px rgba(74,42,140,.25)}
#login.l2 .tile-go::after{content:'  ←'}
#login.l2 .lvl-tag,#login.l2 .tile-badge{color:var(--lp-d)}
#login.l2 .dept-chips button{border-color:var(--lp-line);color:var(--lp-ink)}
#login.l2 .dept-chips button.on{background:var(--lp);border-color:var(--lp);color:#fff}
#login.l2 #lgHint{color:#6B6290}
/* نافذة الدخول */
#login.l2 .lgcard{border-radius:18px}
#login.l2 .lgcard-top{background:linear-gradient(120deg,var(--lp-d),var(--lp))!important}
#login.l2 .lgcard input:focus{border-color:var(--lp)!important;outline:2px solid var(--lp-l)!important;outline-offset:0}
#login.l2 .lgcard .btn.primary{background:var(--lp);border-color:var(--lp)}
/* التذييل */
.l2-foot{margin-top:auto;background:linear-gradient(90deg,var(--lp-d),var(--lp));color:#fff;padding:16px 28px calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:15.5px}
.l2-foot i{opacity:.55;font-style:normal}
@media (max-width:820px){
  #login.l2 .lvl-tag,#login.l2 .tile-badge{font-size:10.5px;padding:0 7px;top:6px}
  .l2-bar{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
  .l2-logo img{height:44px}.l2-uni b{font-size:17px}.l2-uni small{font-size:13px}
  .l2-btn{padding:7px 12px;font-size:13.5px}
  .l2-hero{padding:22px 16px 4px;gap:10px}
  .l2-art{flex-basis:118px}
  .l2-org{font-size:15px;gap:8px}.l2-org i{width:36px;margin-top:16px}
  #login.l2 #lgTitle{font-size:27px;margin:8px 0 6px}
  #login.l2 #lgSub{font-size:14px}
  .l2-search{padding:0 14px}.l2-search input{font-size:16px;padding:8px 10px}.l2-search-go{width:44px;height:44px}
  .l2-allh{padding:0 16px;font-size:18px;margin-top:22px}
  #login.l2 .tiles{grid-template-columns:1fr 1fr;padding:14px 14px 26px;gap:14px}
  #login.l2 .tile-top{height:66px}
  #login.l2 .tile-ic{width:70px;height:70px;bottom:-32px;border-width:4px}
  #login.l2 .tile-ic svg{width:32px;height:32px}
  #login.l2 .tile-b{padding:40px 10px 14px}
  #login.l2 .tile-n{font-size:16px}
  #login.l2 .tile-d{display:block;font-size:12px}
  #login.l2 .tile-go{padding:7px 22px;font-size:14.5px}
  .l2-foot{font-size:13px;gap:8px;padding:12px 14px}
}
@media (max-width:420px){.l2-uni{display:none}.l2-art{flex-basis:96px}#login.l2 #lgTitle{font-size:23px}}
