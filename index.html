<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ar">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قسم المحاسبة بكلية الأعمال</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="config.js"></script>
<script>/* فتح الاتصال بقاعدة البيانات مبكرًا، بالتوازي مع تحميل الصفحة */
try{var l=document.createElement('link');l.rel='preconnect';l.href=window.DMS_CONFIG.supabaseUrl;l.crossOrigin='';document.head.appendChild(l);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16221F; --ink2:#4A5854; --line:#D5DCD8; --paper:#F4F6F5; --card:#FFFFFF;
  --ledger:#1D5445; --ledger2:#2F7461; --brass:#A9822F; --late:#B03D33; --ok:#2E7D4F; --wait:#9A6A12;
  --c-training:#2F6F9F; --c-readiness:#1D5445; --c-exams:#7A4A8C; --c-quality:#A9822F; --c-receptions:#B0573B;
  --r:6px; --font:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif; --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ledger)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hidden{display:none!important}

/* login */
.ledger-lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 35px,rgba(255,255,255,.07) 35px 36px);pointer-events:none}
.brand .committees{display:flex;flex-direction:column;gap:6px;position:relative}
.brand .committees span{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.9}
.brand .committees i{width:22px;height:6px;border-radius:3px;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ledger2)}
.btn.primary{background:var(--ledger);border-color:var(--ledger);color:#fff}
.btn.primary:hover{background:var(--ledger2)}
.btn.danger{color:var(--late);border-color:#E7C3BF}
.btn.sm{padding:3px 10px;font-size:13px}
.err{color:var(--late);font-size:13px;min-height:18px}
.muted{color:var(--ink2)}
.small{font-size:13px}

/* layout */
#app{display:grid;grid-template-columns:250px 1fr;height:100%}
#side{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#side .logo{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
#side .logo b{font-family:var(--display);font-size:19px;color:var(--ledger);display:block;line-height:1.3}
#side .logo small{color:var(--ink2)}
#side nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
#side nav .grp{font-size:12px;color:var(--ink2);padding:12px 10px 4px}
#side nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);cursor:pointer}
#side nav a:hover{background:var(--paper)}
#side nav a.on{background:#E6EEEA;color:var(--ledger);font-weight:600}
#side nav a .sw{width:4px;height:18px;border-radius:2px;flex:none}
#side nav a .n{margin-inline-start:auto;font-size:12px;background:var(--paper);border-radius:10px;padding:0 7px;color:var(--ink2)}
#side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 16px;font-size:13px}
#main-wrap{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
#top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:#fff;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#top h1{font-size:19px;margin:0;font-weight:700}
#top .sp{flex:1}
#menuBtn{display:none}
#main{flex:1;overflow:auto;padding:22px 24px 60px}
#toolHost{flex:1;display:flex;flex-direction:column;min-height:0}
#toolBar{display:flex;gap:8px;align-items:center;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
#toolHost iframe{flex:1;border:0;width:100%;background:#fff}
#toolFrames{flex:1;display:flex;min-height:0}
#toolFrames iframe{display:none}
#toolFrames iframe.on{display:block}

/* components */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.panel>h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h3 .sp{flex:1}
.panel .body{padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:18px}
.stats div{padding:14px 16px;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0}
.stats b{display:block;font-size:26px;font-family:var(--display);line-height:1.2}
.stats span{font-size:13px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ledger{width:100%}
.lrow{display:grid;grid-template-columns:170px 1fr 70px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#FAFBFA}
.lrow .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.lrow .nm i{width:10px;height:10px;border-radius:50%}
.bar{height:10px;background:#EDF0EE;border-radius:5px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.lrow .pc{text-align:left;font-family:var(--display);font-size:18px}
.lrow .meta{grid-column:2/4;font-size:12px;color:var(--ink2);margin-top:-6px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:right;font-weight:600;color:var(--ink2);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);background:#FAFBFA;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #E8ECEA;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#F7F9F8}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;border:1px solid;white-space:nowrap}
.st-not{color:#5B6663;border-color:#C9D0CD}
.st-prog{color:#245F8C;border-color:#B5CDE0;background:#F1F6FA}
.st-pend{color:var(--wait);border-color:#E5CE9E;background:#FCF7EC}
.st-done{color:var(--ok);border-color:#B8D8C4;background:#F1F8F3}
.st-late{color:#fff;border-color:var(--late);background:var(--late)}
.pr-h{color:var(--late)} .pr-m{color:var(--wait)} .pr-l{color:var(--ink2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters>*{width:auto;min-width:130px}
.filters{align-items:center}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink2);text-decoration:none}
.tabs a.on{border-color:var(--ledger);color:var(--ledger);font-weight:600}
.chead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.chead .stripe{width:6px;align-self:stretch;border-radius:3px}
.chead h2{margin:0;font-family:var(--display);font-size:26px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:8px 0;border-bottom:1px solid #E8ECEA;display:flex;gap:10px;align-items:baseline}
.list-plain li:last-child{border-bottom:0}
.date{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;white-space:nowrap}
.tool-card{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.tool-card:last-child{border-bottom:0}
.tool-card .ic{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);flex:none}
.tool-card .sp{flex:1}
.check{display:flex;gap:8px;align-items:center}
.check input{width:auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0}
.comment{border-inline-start:3px solid var(--line);padding:4px 10px;margin:6px 0;font-size:14px}

/* systems launcher */
.home-head{margin-bottom:18px}.home-head h2{font-family:var(--display);font-size:28px;margin:0}.home-head p{margin:4px 0 0}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sys{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;text-align:right;min-height:230px}
.sys:hover{border-color:var(--c);box-shadow:0 6px 20px rgba(22,34,31,.08)}
.sys:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sys-ic{width:48px;height:48px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:18px;margin-bottom:6px}
.sys-name{font-size:19px;font-weight:700}.sys-meta{font-size:13px;color:var(--ink2)}.sys-desc{font-size:14px;color:var(--ink2);flex:1}
.sys-go{align-self:flex-start;background:var(--c);color:#fff;padding:6px 16px;border-radius:var(--r);font-size:14px;margin-top:6px}
/* charts */
.hb{display:flex;flex-direction:column;gap:4px}
.hb-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{position:relative;height:14px;background:#EDF0EE;border-radius:3px;overflow:hidden}
.hb-f{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px}
.hb-tg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.hb-v{font-variant-numeric:tabular-nums;text-align:left;font-weight:600}
.hb-sub{font-size:11px;color:var(--ink2);margin:-2px 0 6px;padding-inline-start:calc(38% + 10px)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:10px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.dn .lgd{flex-direction:column;margin:0}
#syncLbl{margin-inline-end:12px}
/* v2.1 */
.st-ret{color:#9A4A12;border-color:#E9C2A2;background:#FDF3EA}
.gq{width:220px;padding:5px 10px}
.bell{position:relative;display:inline-flex;align-items:center;padding:5px 9px}
.bell-n{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--late);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.wf{display:flex;margin:0 0 16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12px}
.wf span{flex:1;text-align:center;padding:6px 2px;color:var(--ink2);border-inline-start:1px solid var(--line)}
.wf span:first-child{border-inline-start:0}
.wf span.d{background:#E6EEEA;color:var(--ledger)}
.wf span.c{background:var(--ledger);color:#fff;font-weight:600}
.wf span.r{background:#FDF3EA;color:#9A4A12}
.cal .cal-h,.cal .cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-h div{padding:8px;font-size:13px;color:var(--ink2);text-align:center;border-bottom:1px solid var(--line)}
.cal-d{min-height:108px;border-inline-start:1px solid #E8ECEA;border-bottom:1px solid #E8ECEA;padding:4px 5px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-d:nth-child(7n+1){border-inline-start:0}
.cal-d.x{background:#FAFBFA}
.cal-d.today{background:#F2F7F4}
.cal-d.today .cal-n{background:var(--ledger);color:#fff;border-radius:10px;padding:0 7px}
.cal-n{font-size:12px;color:var(--ink2);align-self:flex-start}
.cal-i{display:block;font-size:12px;padding:1px 6px;border-inline-start:3px solid var(--c);background:#F5F7F6;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink);text-decoration:none}
.cal-i.late{background:#FBECEA}.cal-i.done{opacity:.55;text-decoration:line-through}
.plan-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ledger);color:#fff;font-size:13px}
@media (max-width:900px){.gq{width:110px}.cal-d{min-height:70px}.cal-i{font-size:10px}#termLbl{display:none}.wf{font-size:10px}}
/* landing tiles */
#login{min-height:100%;display:flex;flex-direction:column;background:var(--paper)}
.lhead{background:var(--ledger);color:#fff;position:relative;overflow:hidden;padding:calc(34px + env(safe-area-inset-top,0px)) 40px 30px}
.lhead-in{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;max-width:1240px;margin:0 auto}
.lhead h1{font-family:var(--display);font-size:36px;margin:6px 0 4px;line-height:1.3}
.lhead p{margin:0;opacity:.85}
.lhead-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lhead-side .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
.lhead .good,.lhead .muted{color:#CFE6DA}.lhead .bad{color:#FFD2CC}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:30px 40px;max-width:1320px;width:100%;margin:0 auto}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;text-align:right}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(22,34,31,.12);border-color:var(--c)}
.tile:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.tile-top{height:130px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.08) 23px 24px)}
.tile-ic{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.tile-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tile-n{font-size:20px;font-weight:700;color:var(--ink);line-height:1.35}
.tile-d{font-size:13px;color:var(--ink2)}
.tile-chips{display:flex;flex-wrap:wrap;gap:4px}.tile-chips i{font-style:normal;font-size:11px;background:#F1F4F2;border-radius:10px;padding:1px 8px;color:var(--ink2)}
.tile-go{margin-top:auto;align-self:flex-start;background:var(--c);color:#fff;border-radius:6px;padding:5px 18px;font-size:14px}
.tile.alt .tile-top{background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}
.tile.sm .tile-top{height:92px}.tile.sm .tile-ic{width:62px;height:62px}.tile.sm .tile-n{font-size:17px}
.tile-badge{position:absolute;top:10px;inset-inline-start:10px;background:#fff;color:var(--late);font-size:12px;font-weight:700;border-radius:10px;padding:1px 9px}
.tiles-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.sec-h{font-size:16px;margin:8px 0 12px;color:var(--ink2)}
.lgpanel{position:fixed;inset:0;background:rgba(22,34,31,.5);display:flex;align-items:center;justify-content:center;z-index:45;padding:16px}
.lgcard{background:#fff;border-radius:12px;overflow:hidden;width:min(400px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.lgcard-top{background:var(--c);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:14px}
.lgcard-top h2{margin:0;font-size:21px;font-family:var(--display)}
.lgcard-b{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.nav-ic{display:inline-flex;color:var(--ink2)}#side nav a.on .nav-ic{color:var(--ledger)}
.icpick{display:flex;flex-wrap:wrap;gap:8px}.icpick input{display:none}.icpick span{display:grid;place-items:center;width:46px;height:46px;border-radius:8px;border:1px solid var(--line);cursor:pointer;color:var(--ink2)}
.icpick input:checked+span{background:var(--c);color:#fff;border-color:var(--c)}
.syspick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
@media (max-width:900px){.lhead{padding:calc(22px + env(safe-area-inset-top,0px)) 18px 20px}.lhead-in{flex-direction:column;align-items:stretch}.lhead-side{align-items:flex-start}.lhead h1{font-size:24px}
 .tiles{grid-template-columns:1fr 1fr;padding:16px;gap:12px}.tile-top{height:84px}.tile-ic{width:58px;height:58px}.tile-ic svg{width:30px;height:30px}.tile-b{padding:10px 12px 12px}.tile-n{font-size:15px}.tile-d,.tile-chips{display:none}.tile-go{padding:3px 12px;font-size:13px}
 .tiles-s{grid-template-columns:1fr 1fr;gap:10px}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(22,34,31,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 12px}
#modal .box{background:#fff;border-radius:8px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .box.wide{width:min(1180px,100%)}
#modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
#modal .mh h3{margin:0;font-size:17px;flex:1}
#modal .mb{padding:18px}
#modal .mf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
#modal .mf .sp{flex:1}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:6px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

/* clo grid */
.grid-in{font-size:13px}
.grid-in input{padding:3px 4px;width:58px;text-align:center}
.grid-in td,.grid-in th{padding:4px 5px!important;text-align:center!important}
.grid-in td.nm input{width:150px;text-align:right}
.grid-in td.id input{width:95px}
.ach{font-family:var(--display);font-size:22px}
.good{color:var(--ok)} .bad{color:var(--late)}

/* print */
#printArea{display:none}
@media print{
  #printArea .hb-t,#printArea .hb-f,#printArea .lgd i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0 8mm;color:#000}
  #printArea table{width:100%;border-collapse:collapse;font-size:11pt}
  #printArea th,#printArea td{border:1px solid #888;padding:4px 6px;text-align:right}
  #printArea th{background:#eee}
  #printArea .phead{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  @page{size:A4;margin:12mm}
}
@media (max-width:900px){
  #login{grid-template-columns:1fr}
      #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 0 0 auto;width:270px;z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px)}
  #side.open{transform:none}
  #menuBtn{display:inline-block}
  .grid2,.formgrid{grid-template-columns:1fr}
  .lrow{grid-template-columns:1fr 60px}
  .lrow .bar{grid-column:1/-1;grid-row:2}
  .lrow .meta{grid-column:1/-1;margin-top:0}
  #main{padding:16px 14px 60px}
  #top{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

"نظرية المحاسبة", "ACCT 1316", null, null, null, null, null, null], ["بحوث العمليات في المحاسبة", "ACCT 1317", null, null, null, null, null, null], ["الحوكمة ومحاسبة الاستدامة", "ACCT 1318", null, null, null, null, null, null], ["المحاسبة القضائية", "ACCT 1345", null, null, null, null, null, null], ["المحاسبة المالية المتقدمة", "ACCT 1411", null, null, null, null, null, null], ["معايير المحاسبة الدولية", "ACCT 1412", null, null, null, null, null, null], ["المحاسبة الإدارية المتقدمة", "ACCT 1421", null, null, null, null, null, null], ["تطبيقات محاسبية في البيئة الرقمية", "ACCT 1431", null, null, null, null, null, null], ["مناهج البحث في المحاسبة", "ACCT 1441", null, null, null, null, null, null], ["التدريب التعاوني (1)", "ACCT 1451", null, null, null, null, null, null], ["التدريب التعاوني (2)", "ACCT 1452", null, null, null, null, null, null], ["المحاسبة الزراعية", "ACCT 1315", null, null, null, null, null, null], ["نظرية المحاسبة", "ACCT 1316", null, null, null, null, null, null], ["بحوث العمليات في المحاسبة", "ACCT 1317", null, null, null, null, null, null], ["الحوكمة ومحاسبة الاستدامة", "ACCT 1318", null, null, null, null, null, null], ["المحاسبة القضائية", "ACCT 1345", null, null, null, null, null, null]]};

const DEFAULT_COMMITTEES=[
 {id:'training',name:'لجنة إعداد التدريب بالكلية',color:'var(--c-training)',hex:'#2F6F9F',desc:'الخطط التدريبية والأنشطة والمدربون والمستفيدون والجداول.',apps:['training']},
 {id:'readiness',name:'لجنة الجاهزية',color:'var(--c-readiness)',hex:'#1D5445',desc:'متطلبات الجاهزية ونسب الإنجاز والنواقص والأدلة.',apps:['readiness']},
 {id:'exams',name:'لجنة الاختبارات',color:'var(--c-exams)',hex:'#7A4A8C',desc:'خطط وجداول الاختبارات والقاعات والمراقبون والنتائج.',apps:['exams']},
 {id:'quality',name:'لجنة الجودة',color:'var(--c-quality)',hex:'#A9822F',desc:'مؤشرات الأداء وقياس مخرجات التعلم والاستطلاعات وخطط التحسين.',apps:['surveys'],modules:['clo']},

 training:{name:'نظام إدارة التدريب',ver:'6.7',abbr:'تد',committee:'training',desc:'مسار الطلاب في التدريب الميداني، جهات التدريب والمشرفون، الخطابات والنماذج والتقارير للبكالوريوس والدبلوم العالي.'},

function freshDB(){
  const s=SEED||{programs:[],faculty:[],semesters:[],courses:[]};
  return {v:1,
    settings:{university:'جامعة الجوف',college:'كلية الأعمال',dept:'قسم المحاسبة',

function load(){
  try{DB=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){DB=null}
  if(!DB||!DB.settings){DB=freshDB()}
  ['users','tasks','kpis','visits','clo','files','log','customApps'].forEach(k=>DB[k]=DB[k]||[]);DB.tomb=DB.tomb||{};DB.appVersions=DB.appVersions||{};
}
function save(){
  stamp();
  if(DB.log.length>3000)DB.log=DB.log.slice(-3000);
  try{localStorage.setItem(LS_KEY,JSON.stringify(DB));scheduleSync()}catch(e){alert('تعذر الحفظ: مساحة التخزين في المتصفح ممتلئة. صدّر نسخة احتياطية واحذف المرفقات الكبيرة.')}
}
function audit(action,entity,detail,committee){
  DB.log.push({id:uid('l'),at:nowISO(),user:ME?ME.id:'system',action,entity,detail:detail||'',committee:committee||''});
}
/* v2.4: حُذف تعريف قديم مكرر لـ hash (التعريف الفعّال لاحقًا في الملف) */

/* ---------- IndexedDB (attachments + app overrides) ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('dms-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async del(k){const d=await this.open();return new Promise((res)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=res})},
  async keys(){const d=await this.open();return new Promise((res)=>{const r=d.transaction('f').objectStore('f').getAllKeys();r.onsuccess=()=>res(r.result)})}
};

/* ---------- permissions ---------- */
const isAdmin=()=>!!(ME&&ME.isAdmin);
/* v2.5: رئيس القسم يرى لجان قسمه فقط، والعميد والوكلاء يرون كل اللجان */
const roleIn=cid=>(SCOPE&&SCOPE!=='owner'&&SCOPE!=='head'&&SCOPE!=='college'&&cid!==SCOPE)?null:isAdmin()?'admin':(ME&&(ME.collegeRole||(ME.headDept&&deptOf(cid)===ME.headDept)))?'head':((ME&&ME.memberships&&ME.memberships[cid])||null);
const isChair=cid=>!!roleIn(cid)&&(isAdmin()||roleIn(cid)==='head'||roleIn(cid)==='chair');
const myCommittees=()=>DB.committees.filter(c=>roleIn(c.id));
const comm=id=>DB.committees.find(c=>c.id===id)||{id,name:'—',hex:'#888',color:'#888'};
const user=id=>DB.users.find(u=>u.id===id);
const uname=id=>{const u=user(id);return u?u.name:'—'};
function canEditTask(t){
  if(isChair(t.committee))return true;
  if(!roleIn(t.committee)||roleIn(t.committee)==='viewer')return false; /* v3.0: المطّلع يقرأ فقط */
  if(t.status==='done')return false;
  return t.assignee===ME.id||t.createdBy===ME.id;
}
/* v2.4: رئيس اللجنة يدير فقط أعضاء لجانه الذين ليسوا مالكًا ولا رئيس قسم ولا رئيس لجنة */
function canManageUser(u){if(!u)return false;if(isAdmin())return true;if(u.isAdmin||u.head||u.headDept||u.collegeRole||(ME&&u.id===ME.id))return false;
  const chairOf=DB.committees.filter(c=>isChair(c.id)).map(c=>c.id);const ms=Object.entries(u.memberships||{});
  return ms.length>0&&ms.every(([c,r])=>chairOf.includes(c)&&r!=='chair')}
function membersOf(cid){return DB.users.filter(u=>u.active!==false&&(u.memberships||{})[cid])}

async function boot(){

function firstRunDlg(){

   <div class="formgrid"><label class="f full">الاسم<input id="frN" value="مدير النظام"></label><label class="f">اسم المستخدم<input id="frU" dir="ltr" autocomplete="username"></label><span></span>
   <label class="f">كلمة المرور (8 أحرف على الأقل)<input id="frP" type="password" dir="ltr" autocomplete="new-password"></label><label class="f">تأكيد كلمة المرور<input id="frP2" type="password" dir="ltr" autocomplete="new-password"></label><div class="err full" id="frErr"></div></div>`,
   `<button class="btn primary" onclick="doFirstRun()">إنشاء حساب المالك</button><span class="sp" style="flex:1"></span><button class="btn" onclick="closeModal(true);linkDeviceDlg()">ربط الجهاز بقاعدة القسم</button>`,false,true)}
async function doFirstRun(){
  const n=val('frN')||'مدير النظام',un=val('frU'),p1=$('#frP').value,p2=$('#frP2').value;
  if(!/^[A-Za-z0-9._-]{3,}$/.test(un)){$('#frErr').textContent='اسم المستخدم بالأحرف الإنجليزية والأرقام، 3 أحرف على الأقل.';return}
  if(p1.length<8){$('#frErr').textContent='استخدم 8 أحرف على الأقل.';return}
  if(p1!==p2){$('#frErr').textContent='التأكيد لا يطابق كلمة المرور.';return}
  if(DB.users.length){closeModal(true);return}
  DB.users.push({id:uid('u'),username:un,name:n,isAdmin:true,memberships:{},active:true,mustChange:false,pass:await hash(un,p1)});
  audit('إنشاء حساب المالك','مستخدم',un);save();closeModal(true);$('#lgHint').textContent='';renderLanding();
  toast('أُنشئ حساب المالك. ادخل من خلية «الإعدادات العامة».');
}
function enter(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');

  go('home');
}

const TITLES={home:'الصفحة الرئيسية',head:'لوحة رئيس القسم',clo:'نظام قياس مخرجات التعلم',visits:'نظام الاستقبالات والزيارات',dash:'لوحة المتابعة',tasks:'المهام',approvals:'بانتظار اعتمادي',kpis:'المؤشرات وخطط التحسين',files:'المرفقات والأدلة',reports:'التقارير',users:'المستخدمون والصلاحيات',log:'سجل التغييرات',settings:'الإعدادات'};

/* ---------- modal ---------- */
let MODAL_LOCK=false;
function modal(title,body,foot,wide,locked){
  if(MODAL_LOCK&&!locked&&!$('#modal').classList.contains('hidden'))return; /* v2.4: لا تُستبدل نافذة إلزامية */
  MODAL_LOCK=!!locked;
  $('#mbox').setAttribute('role','dialog');$('#mbox').setAttribute('aria-modal','true');

  $('#modal').classList.remove('hidden');
  const f=$('#mbox').querySelector('input:not([type=hidden]):not([readonly]),select,textarea');if(f)setTimeout(()=>f.focus(),30);
}
function closeModal(force){if(MODAL_LOCK&&force!==true)return;MODAL_LOCK=false;$('#modal').classList.add('hidden');$('#mbox').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
const opt=(list,sel,empty)=>(empty!=null?`<option value="">${esc(empty)}</option>`:'')+list.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`}).join('');
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

   `<button class="btn primary" onclick="doChangePass(${!!forced})">حفظ كلمة المرور</button>${forced?'':'<button class="btn" onclick="closeModal()">إلغاء</button>'}`,false,!!forced);

/* ===================== لوحة التحكم ===================== */
function pgDash(){
  const cs=myCommittees();
  const ts=visibleTasks();
  const done=ts.filter(t=>t.status==='done').length, late=ts.filter(isLate), pend=ts.filter(t=>t.status==='pend');
  const t0=today();
  const upcoming=ts.filter(t=>t.status!=='done'&&t.end&&t.end>=t0&&daysBetween(t0,t.end)<=(DB.settings.upcomingDays||14)).sort((a,b)=>a.end.localeCompare(b.end));
  const avg=ts.length?Math.round(ts.reduce((a,t)=>a+(t.status==='done'?100:(+t.progress||0)),0)/ts.length):0;
  const visits=roleInType('receptions')?DB.visits.filter(v=>(!v.committee||roleIn(v.committee))&&v.status!=='cancel'&&v.date>=t0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6):[];
  const kp=DB.kpis.filter(k=>roleIn(k.committee));
  const kpOk=kp.filter(kpiMet).length;
  const lastClo=roleInType('quality')?DB.clo.slice(-1)[0]:null;
  let h=`<div class="stats">
    <div><b>${avg}%</b><span>متوسط الإنجاز</span></div>
    <div><b>${ts.length}</b><span>إجمالي المهام</span></div>
    <div><b class="good">${done}</b><span>مكتملة</span></div>
    <div><b class="${late.length?'bad':''}">${late.length}</b><span>متأخرة</span></div>
    <div><b style="color:var(--wait)">${pend.length}</b><span>تحتاج اعتماد</span></div>
    <div><b>${kp.length?kpOk+'/'+kp.length:'—'}</b><span>مؤشرات محققة</span></div>
  </div>`;
  h+=`<div class="panel"><h3>إنجاز اللجان<span class="sp"></span><span class="small muted">مكتمل · جارٍ · متأخر</span></h3><div class="ledger">`;
  h+=cs.length?cs.map(c=>{const s=commStats(c.id);const w=x=>s.n?(x/s.n*100):0;
    return `<div class="lrow" onclick="go('committee',{cid:'${c.id}'})"><div class="nm"><i style="background:${c.hex}"></i>${esc(c.name)}</div>
      <div class="bar" title="${s.done} مكتملة، ${s.late} متأخرة"><span style="width:${w(s.done)}%;background:${c.hex}"></span><span style="width:${w(s.n-s.done-s.late)}%;background:${c.hex};opacity:.3"></span><span style="width:${w(s.late)}%;background:var(--late)"></span></div>
      <div class="pc">${s.avg}%</div>
      <div class="meta">${s.n} مهمة · ${s.done} مكتملة · ${s.late} متأخرة · ${s.pend} بانتظار الاعتماد</div></div>`}).join('')
    :`<div class="empty">لم تُضف إلى أي لجنة بعد. اطلب من مدير النظام أو رئيس اللجنة إضافتك.</div>`;
  h+=`</div></div>`;
  h+=`<div class="grid2">`;
  h+=`<div class="panel"><h3>أعمال متأخرة<span class="sp"></span>${late.length?`<a class="small" onclick="go('tasks',{f:{late:1}})" style="cursor:pointer">عرض الكل</a>`:''}</h3><div class="body">${late.length?taskMiniList(late.slice(0,7),true):'<div class="muted small">لا توجد أعمال متأخرة.</div>'}</div></div>`;
  h+=`<div class="panel"><h3>مستحقة خلال ${DB.settings.upcomingDays||14} يومًا</h3><div class="body">${upcoming.length?taskMiniList(upcoming.slice(0,7)):'<div class="muted small">لا توجد مهام مستحقة قريبًا.</div>'}</div></div>`;
  if(roleInType('receptions'))h+=`<div class="panel"><h3>الاستقبالات المجدولة<span class="sp"></span><a class="small" style="cursor:pointer" onclick="go('visits')">كل الزيارات</a></h3><div class="body">${visits.length?`<ul class="list-plain">${visits.map(v=>`<li><span class="date">${fmtD(v.date)} ${esc(v.time||'')}</span><span style="flex:1">${esc(v.title)}<div class="small muted">${esc(v.guest||'')}</div></span></li>`).join('')}</ul>`:'<div class="muted small">لا توجد زيارات قادمة.</div>'}</div></div>`;
  if(roleInType('exams')){const ex=DB.tasks.filter(t=>t.committee==='exams'&&t.status!=='done'&&t.status!=='arch'&&t.end>=t0).sort((a,b)=>a.end.localeCompare(b.end)).slice(0,6);
    h+=`<div class="panel"><h3>أعمال الاختبارات القادمة<span class="sp"></span><a class="small" style="cursor:pointer" onclick="go('tool',{app:'exams'})">فتح نظام الاختبارات</a></h3><div class="body">${ex.length?taskMiniList(ex):'<div class="muted small">لا توجد مهام قادمة للجنة الاختبارات.</div>'}</div></div>`}
  if(roleInType('readiness')){const s=commStats('readiness');
    h+=`<div class="panel"><h3>حالة الجاهزية</h3><div class="body"><div class="ach">${s.avg}%</div><div class="small muted">${s.n} متطلب/مهمة · ${s.done} مكتمل · ${s.late} متأخر · ${s.n-s.done} نواقص مفتوحة</div><div style="margin-top:10px"><button class="btn sm" onclick="go('tool',{app:'readiness'})">فتح نظام الجاهزية</button></div></div></div>`}

  h+=`</div>`;
  const acts=DB.log.filter(l=>isAdmin()||!l.committee||roleIn(l.committee)).slice(-8).reverse();
  h+=`<div class="panel"><h3>آخر النشاطات</h3><div class="body">${acts.length?`<ul class="list-plain">${acts.map(l=>`<li><span class="date">${fmtDT(l.at)}</span><span><b>${esc(uname(l.user))}</b> ${esc(l.action)} ${esc(l.entity)} <span class="muted">${esc(l.detail)}</span></span></li>`).join('')}</ul>`:'<div class="muted small">لا يوجد نشاط بعد.</div>'}</div></div>`;
  return h;
}

  let h=`<div class="chead"><div class="stripe" style="background:${c.hex}"></div><div style="flex:1"><h2>${esc(c.name)}</h2><div class="muted">${esc(c.desc||'')}</div>

/* v2.4: حُذف تعريف قديم مكرر لـ pgApprovals (التعريف الفعّال لاحقًا في الملف) */
let TF={};
function tasksTable(list,o){
  o=o||{};
  if(o.f)TF=Object.assign({},o.f);
  const f=o.noFilter?{}:TF;
  let rows=list.filter(t=>(!f.c||t.committee===f.c)&&(!f.s||(f.s==='late'?isLate(t):t.status===f.s&&!isLate(t)))&&(!f.late||isLate(t))&&(!f.a||t.assignee===f.a)&&(!f.p||t.priority===f.p)&&(!f.mine||t.assignee===ME.id)&&(!f.q||(t.title+' '+(t.notes||'')).includes(f.q)));
  rows.sort((a,b)=>(isLate(b)-isLate(a))||((a.end||'9')>(b.end||'9')?1:-1));
  const canNew=o.cid?canCreateIn(o.cid):myCommittees().some(c=>canCreateIn(c.id));
  let h='';
  if(!o.noFilter){
    const cs=myCommittees();
    h+=`<div class="filters">
      ${o.cid?'':`<select onchange="TF.c=this.value;refresh()">${opt(cs.map(c=>({v:c.id,l:c.name})),f.c,'كل اللجان')}</select>`}
      <select onchange="TF.s=this.value;TF.late=0;refresh()">${opt(Object.entries(STATUS).map(([v,l])=>({v,l})).concat([{v:'late',l:'متأخر'}]),f.late?'late':f.s,'كل الحالات')}</select>
      <select onchange="TF.p=this.value;refresh()">${opt(Object.entries(PRIORITY).map(([v,l])=>({v,l})),f.p,'كل الأولويات')}</select>
      <label class="check small"><input type="checkbox" ${f.mine?'checked':''} onchange="TF.mine=this.checked;refresh()"> المسندة إليّ</label>
      <input placeholder="بحث في المهام" value="${esc(f.q||'')}" onchange="TF.q=this.value;refresh()" style="flex:1">
      ${canNew?`<button class="btn primary" onclick="openTask(null,'${o.cid||''}')">مهمة جديدة</button>`:''}
    </div>`;
  }
  if(!rows.length)return h+`<div class="panel"><div class="empty">${list.length?'لا توجد مهام مطابقة للفلترة.':'لا توجد مهام بعد. أضف أول مهمة لتبدأ متابعة الإنجاز.'}</div></div>`;
  h+=`<div class="panel tbl-wrap"><table class="t"><tr><th>المهمة</th>${o.cid?'':'<th>اللجنة</th>'}<th>المسؤول</th><th>البداية</th><th>النهاية</th><th>الإنجاز</th><th>الأولوية</th><th>الحالة</th><th>آخر تحديث</th></tr>`;
  h+=rows.map(t=>{const c=comm(t.committee);const p=t.status==='done'?100:(+t.progress||0);
    return `<tr class="click" onclick="openTask('${t.id}')"><td><b style="font-weight:600">${esc(t.title)}</b>${(t.files||[]).length?` <span class="small muted">📎${t.files.length}</span>`:''}</td>
    ${o.cid?'':`<td class="small"><span style="color:${c.hex}">●</span> ${esc(c.name)}</td>`}
    <td class="small">${esc(uname(t.assignee))}</td><td class="date">${fmtD(t.start)}</td><td class="date">${fmtD(t.end)}</td>
    <td style="min-width:90px"><div class="bar" style="height:6px"><span style="width:${p}%;background:${c.hex}"></span></div><span class="small muted">${p}%</span></td>
    <td class="small pr-${t.priority||'m'}">${PRIORITY[t.priority||'m']}</td><td>${statusPill(t)}</td><td class="date">${fmtD(t.updatedAt)}</td></tr>`}).join('');
  return h+`</table></div>`;
}

async function deleteTask(id){
  const t=DB.tasks.find(x=>x.id===id);if(!confirm('حذف المهمة «'+t.title+'» ومرفقاتها؟'))return;
  for(const f of (t.files||[])){await IDB.del('file:'+f);DB.files=DB.files.filter(x=>x.id!==f)}
  DB.tasks=DB.tasks.filter(x=>x.id!==id);audit('حذف مهمة',t.title,'',t.committee);save();closeModal();refresh();
}
/* v2.4: حُذف تعريف قديم مكرر لـ fileList (التعريف الفعّال لاحقًا في الملف) */
async function attachFiles(list,ref,cid){
  for(const file of list){
    if(file.size>25*1024*1024){alert('الملف '+file.name+' أكبر من 25 م.ب.');continue}
    const id=uid('f');await IDB.put('file:'+id,file);
    DB.files.push({id,name:file.name,type:file.type,size:file.size,ref,committee:cid,by:ME.id,at:nowISO()});
    const holder=refObj(ref);if(holder){holder.files=holder.files||[];holder.files.push(id)}
    audit('أرفق ملفًا',refTitle(ref),file.name,cid);
  }
  save();reopenRef(ref);toast('تم رفع المرفقات');
}
function refObj(ref){const m={task:DB.tasks,kpi:DB.kpis,visit:DB.visits,clo:DB.clo}[ref.kind];return m?m.find(x=>x.id===ref.id):null}
function refTitle(ref){const o=refObj(ref);return o?(o.title||o.name||o.courseName||''):''}
function reopenRef(ref){if(ref.kind==='task')openTask(ref.id);else if(ref.kind==='kpi')openKpi(ref.id);else if(ref.kind==='visit')openVisit(ref.id);else refresh()}
async function downloadFile(id){
  const f=DB.files.find(x=>x.id===id);const b=await IDB.get('file:'+id);if(!b){alert('الملف غير موجود في هذا المتصفح.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function removeFile(id){
  const f=DB.files.find(x=>x.id===id);if(!confirm('حذف المرفق '+f.name+'؟'))return;
  await IDB.del('file:'+id);DB.files=DB.files.filter(x=>x.id!==id);const o=refObj(f.ref);if(o)o.files=(o.files||[]).filter(x=>x!==id);
  audit('حذف مرفقًا',refTitle(f.ref),f.name,f.committee);save();reopenRef(f.ref);
}

const CLO_DOMAINS=['المعرفة والفهم','المهارات','المهارات','القيم والاستقلالية والمسؤولية'];
const CLO_TEMPLATE=[['الاختبار الفصلي الأول',[10,5,0,0]],['الاختبار الفصلي الثاني',[10,5,0,0]],['الاختبار النهائي',[20,20,0,0]],['الواجبات والتكليفات',[5,1,0,4]],['المشاركة والنقاش',[0,0,0,3]],['التقارير والعروض',[6,2,0,9]]];
function gradeLetter(v){return v>=95?'أ+':v>=90?'أ':v>=85?'ب+':v>=80?'ب':v>=75?'ج+':v>=70?'ج':v>=65?'د+':v>=60?'د':v>=1?'هـ':'م/غ'}
function cloCalc(m){
  const cells=[];m.assess.forEach((a,i)=>a.marks.forEach((mk,j)=>{if(+mk>0)cells.push({i,j,max:+mk})}));
  const st=m.students.filter(s=>s.sid||s.name);
  const res=[0,1,2,3].map(j=>{const cs=cells.filter(c=>c.j===j);const max=cs.reduce((a,c)=>a+c.max,0);if(!max||!st.length)return null;
    let sum=0,pass=0;st.forEach(s=>{const got=cs.reduce((a,c)=>a+(+s.sc[c.i+'-'+c.j]||0),0);sum+=got;if(got/max*100>=m.target)pass++});
    return {max,avg:sum/st.length/max*100,passPct:pass/st.length*100}});
  const totals=st.map(s=>cells.reduce((a,c)=>a+(+s.sc[c.i+'-'+c.j]||0),0));
  const grades={};totals.forEach(t=>{const g=gradeLetter(t);grades[g]=(grades[g]||0)+1});
  return {cells,res,totals,grades,n:st.length,totalMax:cells.reduce((a,c)=>a+c.max,0),passN:totals.filter(t=>t>=60).length};
}

/* استيراد ملف مخرجات التعلم (نفس قالب القسم) */
async function importCloXlsx(file){
  if(!file)return;
  try{await ensureXLSX()}catch(e){alert('تعذر تحميل مكتبة Excel. تحقق من اتصال الإنترنت.');return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const sh=n=>wb.Sheets[n]||wb.Sheets[Object.keys(wb.Sheets).find(k=>k.trim()===n.trim())];
  const home=sh('الصفحة الرئيسية'),dist=sh('توزيع مخرجات التعلم'),grades=sh('إدخال الدرجات');
  if(!dist||!grades){alert('الملف لا يطابق قالب «مخرجات التعلم»: لم أجد ورقتي «توزيع مخرجات التعلم» و«إدخال الدرجات».');return}
  const g=(s,a)=>{const c=s&&s[a];return c?c.v:''};
  const cols=['F','H','J','L'],rowsA=[12,14,16,18,20,22];
  const m={id:uid('c'),program:g(home,'G9'),instructor:g(home,'G11'),courseName:g(home,'G13'),code:g(home,'G15'),gender:{1:'طلاب',2:'طالبات',3:'مجمع'}[g(home,'O2')]||'طلاب',section:String(g(home,'G19')||''),semester:g(home,'G21'),target:75,
    clos:cols.map(cl=>{const v=g(dist,cl+'10');return v&&v!=='.'?String(v):''}),
    assess:rowsA.map(r=>({name:String(g(dist,'D'+r)||''),marks:cols.map(cl=>+g(dist,cl+r)||0)})),students:[],files:[],createdBy:ME.id,createdAt:nowISO()};
  const cr=DB.settings.courses.find(x=>x.name===m.courseName||x.code===m.code);if(cr){if(!m.code)m.code=cr.code;m.clos=m.clos.map((t,j)=>t||cr.clos[j]||'')}
  /* خريطة أعمدة ورقة إدخال الدرجات حسب القالب */
  const map={D:'0-0',E:'0-1',F:'0-2',G:'1-0',H:'1-1',I:'1-2',J:'3-0',K:'3-1',L:'3-3',M:'4-3',N:'5-0',O:'5-1',P:'5-3',R:'2-0',S:'2-1',T:'2-2'};
  const range=XLSX.utils.decode_range(grades['!ref']);
  for(let r=4;r<=range.e.r+1;r++){const sid=g(grades,'B'+r),name=g(grades,'C'+r);if(!sid&&!name)continue;if(!/\d/.test(String(sid))&&/متوسط|نسبة|مجموع|المتوسط/.test(String(sid)+String(name)))continue;if(!/\d/.test(String(sid))&&!name)continue;
    const s={sid:String(sid||''),name:String(name||'').trim(),sc:{}};Object.entries(map).forEach(([cl,k])=>{const v=g(grades,cl+r);s.sc[k]=v===''||v==null?'':+v});m.students.push(s)}
  (m.committee=m.committee||pickComm(appComms('clo')),DB.clo.push(m));audit('استورد ملف مخرجات',m.courseName,file.name+' – '+m.students.length+' طالب','quality');save();
  go('clo',{clo:m.id});toast('تم استيراد '+m.students.length+' طالب');
}

  printDoc('تقرير قياس مخرجات التعلم',`<table><tr><th>اسم البرنامج</th><td>${esc(m.program)}</td><th>أستاذ المقرر</th><td>${esc(m.instructor)}</td></tr><tr><th>اسم المقرر</th><td>${esc(m.courseName)}</td><th>رمز المقرر</th><td>${esc(m.code)}</td></tr><tr><th>الشطر / الشعبة</th><td>${esc(m.gender)} / ${esc(m.section)}</td><th>الفصل الدراسي</th><td>${esc(m.semester)}</td></tr></table>

async function saveUser(id){

  if(!$('#uAc').disabled)u.active=$('#uAc').checked;
  if($('#uHD')){u.headDept=$('#uHD').value;u.head=!!u.headDept;if(u.headDept)DB.users.forEach(x=>{if(x!==u&&x.headDept===u.headDept){x.headDept='';x.head=false}})}if($('#uCR'))u.collegeRole=$('#uCR').value;

const REPORTS={monthly:'التقرير الشهري للقسم',committee:'تقرير لجنة',progress:'تقرير نسب الإنجاز',late:'تقرير الأعمال المتأخرة',readiness:'تقرير الجاهزية',quality:'تقرير الجودة والمؤشرات',visits:'تقرير الاستقبالات',member:'تقرير إنجاز الأعضاء'};
function pgReports(){
  const r=VIEW.r||'monthly';const cs=myCommittees();
  const month=VIEW.m||today().slice(0,7);const cid=VIEW.cid2||(cs[0]||{}).id;
  let h=`<div class="filters"><select onchange="go('reports',Object.assign(VIEW,{r:this.value}))">${opt(Object.entries(REPORTS).map(([v,l])=>({v,l})),r)}</select>
    ${r==='monthly'?`<input type="month" value="${month}" onchange="go('reports',Object.assign(VIEW,{m:this.value}))" style="width:auto">`:''}
    ${r==='committee'?`<select onchange="go('reports',Object.assign(VIEW,{cid2:this.value}))">${opt(cs.map(c=>({v:c.id,l:c.name})),cid)}</select>`:''}
    <span style="flex:1"></span><button class="btn" onclick="printReport()">طباعة / PDF</button><button class="btn" onclick="exportReportWord()">تصدير Word</button><button class="btn primary" onclick="exportReport()">تصدير Excel</button></div>`;
  const rep=buildReport(r,{month,cid});
  h+=`<div class="panel"><h3>${esc(rep.title)}</h3><div class="body">${rep.summary?`<p>${rep.summary}</p>`:''}${rep.tables.map(t=>`<h4 style="margin:14px 0 6px">${esc(t.name)}</h4><div class="tbl-wrap">${tblHtml(t.rows)}</div>`).join('')||'<div class="empty">لا توجد بيانات لهذا التقرير.</div>'}</div></div>`;
  return h;
}
function tblHtml(rows){if(!rows.length||rows.length<2)return '<div class="small muted">لا توجد بيانات.</div>';return `<table class="t"><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`}
const taskRow=t=>[t.title,comm(t.committee).name,uname(t.assignee),fmtD(t.start),fmtD(t.end),(t.status==='done'?100:+t.progress||0)+'%',PRIORITY[t.priority||'m'],isLate(t)?'متأخر':STATUS[t.status]];
const TASK_HEAD=['المهمة','اللجنة','المسؤول','البداية','النهاية','الإنجاز','الأولوية','الحالة'];
function buildReport(r,o){
  const ts=visibleTasks(),cs=myCommittees();
  const commRows=[['اللجنة','المهام','مكتملة','جارية','بانتظار الاعتماد','متأخرة','متوسط الإنجاز'],...cs.map(c=>{const s=commStats(c.id);return [c.name,s.n,s.done,s.prog,s.pend,s.late,s.avg+'%']})];
  if(r==='monthly'){
    const m=o.month;const inM=d=>d&&d.slice(0,7)===m;
    const doneM=ts.filter(t=>t.status==='done'&&inM(t.approvedAt||t.updatedAt)),dueM=ts.filter(t=>inM(t.end)),newM=ts.filter(t=>inM(t.createdAt));
    const vis=roleInType('receptions')?DB.visits.filter(v=>inM(v.date)):[];
    return {title:REPORTS.monthly+' – '+m,summary:`أُنشئت ${newM.length} مهمة، واكتملت ${doneM.length}، ويستحق خلال الشهر ${dueM.length}، والمتأخر حاليًا ${ts.filter(isLate).length}.${vis.length?` نُفذت/جُدولت ${vis.length} زيارة.`:''}`,
      tables:[{name:'ملخص اللجان',rows:commRows},{name:'المهام المكتملة خلال الشهر',rows:[TASK_HEAD,...doneM.map(taskRow)]},{name:'المهام المستحقة خلال الشهر',rows:[TASK_HEAD,...dueM.map(taskRow)]},...(vis.length?[{name:'الزيارات',rows:[['الزيارة','الضيف','التاريخ','الحالة'],...vis.map(v=>[v.title,v.guest,fmtD(v.date),VST[v.status]])]}]:[])]};

  if(r==='visits'){const v=roleInType('receptions')?DB.visits:[];return {title:REPORTS.visits,tables:[{name:'الزيارات',rows:[['الزيارة','الضيف','العدد','التاريخ','المكان','المسؤول','التجهيزات','الحالة'],...v.map(x=>[x.title,x.guest,x.guestCount,fmtD(x.date),x.place,uname(x.owner),(x.prep||[]).filter(p=>p.done).length+'/'+(x.prep||[]).length,VST[x.status]])]}]}}
  if(r==='member'){const us=DB.users.filter(u=>ts.some(t=>t.assignee===u.id));return {title:REPORTS.member,tables:[{name:'إنجاز الأعضاء',rows:[['العضو','المهام','مكتملة','متأخرة','متوسط الإنجاز'],...us.map(u=>{const l=ts.filter(t=>t.assignee===u.id);return [u.name,l.length,l.filter(t=>t.status==='done').length,l.filter(isLate).length,Math.round(l.reduce((a,t)=>a+(t.status==='done'?100:+t.progress||0),0)/l.length)+'%']})]}]}}

/* ===================== تتبع التغييرات (لأجل المزامنة) ===================== */
const STAMPED=['users','tasks','kpis','visits','clo','files','committees','customApps'];
let SNAP={};
function strip(o){const c=Object.assign({},o);delete c._u;return JSON.stringify(c)}
function initSnap(){
  SNAP={};DB.tomb=DB.tomb||{};DB.appVersions=DB.appVersions||{};
  STAMPED.forEach(C=>(DB[C]||[]).forEach(it=>{if(!it._u)it._u=it.updatedAt||it.at||it.createdAt||'2000-01-01T00:00:00.000Z';SNAP[C+':'+it.id]=strip(it)}));
  if(!DB.settings._u)DB.settings._u='2000-01-01T00:00:00.000Z';SNAP['settings']=strip(DB.settings);
  Object.entries(DB.appVersions).forEach(([k,v])=>{if(!v._u)v._u='2000-01-01T00:00:00.000Z';SNAP['av:'+k]=strip(v)});
  DB.log.forEach(l=>{if(!l.id)l.id='l'+(l.at||'')+(l.user||'')});
}
function stamp(){
  const now=nowISO();const seen=new Set();
  STAMPED.forEach(C=>(DB[C]||[]).forEach(it=>{const k=C+':'+it.id,j=strip(it);seen.add(k);if(SNAP[k]!==j){it._u=now;SNAP[k]=j}}));
  Object.keys(SNAP).forEach(k=>{const [C,id]=k.split(':');if(STAMPED.includes(C)&&!seen.has(k)){DB.tomb[id]=now;delete SNAP[k]}});
  const sj=strip(DB.settings);if(SNAP.settings!==sj){DB.settings._u=now;SNAP.settings=sj}
  Object.entries(DB.appVersions).forEach(([k,v])=>{const j=strip(v);if(SNAP['av:'+k]!==j){v._u=now;SNAP['av:'+k]=j}});
}
function mergeDB(L,R){
  const M=JSON.parse(JSON.stringify(L));
  M.tomb=Object.assign({},R.tomb||{});Object.entries(L.tomb||{}).forEach(([k,v])=>{if(!M.tomb[k]||v>M.tomb[k])M.tomb[k]=v});
  const newer=(a,b)=>!a?b:!b?a:((b._u||'')>(a._u||'')?b:a);
  STAMPED.forEach(C=>{
    const map=new Map();(L[C]||[]).forEach(x=>map.set(x.id,x));
    (R[C]||[]).forEach(x=>map.set(x.id,newer(map.get(x.id),x)));
    M[C]=[...map.values()].filter(x=>!(M.tomb[x.id]&&M.tomb[x.id]>=(x._u||''))).map(x=>JSON.parse(JSON.stringify(x)));
  });
  /* v2.4: حساب u-admin الافتراضي المحلي لا يطغى على حساب المدير الحقيقي */
  M.users=(M.users||[]).map(u=>{if(u.id!=='u-admin'||!u.mustChange)return u;const r=(R.users||[]).find(x=>x.id===u.id);return (r&&!r.mustChange)?JSON.parse(JSON.stringify(r)):u});
  M.settings=JSON.parse(JSON.stringify(newer(L.settings,R.settings)));
  M.appVersions={};new Set([...Object.keys(L.appVersions||{}),...Object.keys(R.appVersions||{})]).forEach(k=>{M.appVersions[k]=JSON.parse(JSON.stringify(newer((L.appVersions||{})[k],(R.appVersions||{})[k])))});
  const lm=new Map();[...(L.log||[]),...(R.log||[])].forEach(l=>lm.set(l.id||('l'+l.at+l.user),l));
  M.log=[...lm.values()].sort((a,b)=>(a.at||'').localeCompare(b.at||'')).slice(-3000);
  return normalize(M);
}
function normalize(D){
  ['users','tasks','kpis','visits','clo','files','log','customApps'].forEach(k=>D[k]=Array.isArray(D[k])?D[k]:[]);
  D.tomb=D.tomb||{};D.appVersions=D.appVersions||{};
  D.tasks.forEach(t=>{t.files=t.files||[];t.comments=t.comments||[]});
  D.kpis.forEach(k=>k.files=k.files||[]);D.visits.forEach(v=>{v.files=v.files||[];v.prep=v.prep||[]});
  D.clo.forEach(m=>{m.files=m.files||[];m.students=(m.students||[]).map(s=>Object.assign({sc:{}},s));m.assess=m.assess||[];m.clos=m.clos||['','','','']});
  D.users.forEach(u=>u.memberships=u.memberships||{});
  return D;
}

/* ===================== المزامنة السحابية (Firebase Realtime Database) ===================== */
const SYNC_KEY='dms-sync';
const SY={busy:false,timer:null,last:null,state:'off',msg:''};
function syncCfg(){try{const c=JSON.parse(localStorage.getItem(SYNC_KEY));return c&&c.url?c:null}catch(e){return null}}
function fbUrl(path){const c=syncCfg();return c.url.replace(/\/+$/,'')+'/'+path+'.json'+(c.secret?'?auth='+encodeURIComponent(c.secret):'')}
async function fbReq(method,path,body,headers){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
  try{return await fetch(fbUrl(path),{method,body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal,headers:Object.assign(body===undefined?{}:{'Content-Type':'application/json'},headers||{})})}
  finally{clearTimeout(to)}
}
async function fbErr(r){const t=await r.text();return new Error(r.status===401?'الصلاحية مرفوضة: تحقق من المفتاح السري أو قواعد قاعدة البيانات':('خطأ '+r.status+' '+t.slice(0,80)))}
async function fb(method,path,body){const r=await fbReq(method,path,body);if(!r.ok)throw await fbErr(r);return method==='GET'?await r.json():true}
function setSync(state,msg){SY.state=state;SY.msg=msg||'';
  const m={off:['',''],ok:['✓ متزامن','good'],busy:['جارٍ المزامنة…','muted'],err:['⚠ غير متصل','bad']}[state];
  const el=$('#syncLbl');if(el){el.textContent=syncCfg()?m[0]:'';el.className='small '+m[1];el.title=msg||(SY.last?'آخر مزامنة '+fmtDT(SY.last):'')}
  const lg=$('#lgSync');if(lg)lg.innerHTML=syncCfg()?`<span class="${m[1]}">${state==='ok'?'الجهاز مرتبط بقاعدة بيانات القسم':state==='busy'?'جارٍ تحميل بيانات القسم…':'تعذر الاتصال بقاعدة بيانات القسم'}</span>`:'';
}
function scheduleSync(){if(!syncCfg())return;SY.dirty=true;clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,1500)}
/* v2.4: الاستطلاع يقرأ رقم المراجعة الصغير dms/rev فقط، ولا تُنزّل البيانات إلا عند تغيّرها.
   الكتابة مشروطة بـ ETag (إن دعمه الخادم) لمنع ضياع تعديلات جهازين يحفظان في اللحظة نفسها. */
async function syncNow(opts){
  if(!syncCfg()||SY.busy)return false;
  if(opts&&opts.poll&&!SY.dirty&&SY.rev){
    try{const rv=await fb('GET','dms/rev');if(rv===SY.rev){SY.last=nowISO();setSync('ok');return true}}
    catch(e){setSync('err',e.message||String(e));return false}
  }
  SY.busy=true;setSync('busy');
  try{
    for(let attempt=0;attempt<4;attempt++){
      let etag=null,remoteStr=null,got=false;
      if(SY.etagOK!==false){
        try{const r=await fbReq('GET','dms/data',undefined,{'X-Firebase-ETag':'true'});
          if(!r.ok)throw await fbErr(r);
          etag=r.headers.get('ETag');remoteStr=await r.json();got=true;if(!etag)SY.etagOK=false}
        catch(e){if(e instanceof TypeError)SY.etagOK=false;else throw e}
      }
      if(!got)remoteStr=await fb('GET','dms/data');
      stamp();
      let R=null;if(remoteStr){try{R=normalize(JSON.parse(remoteStr))}catch(e){R=null}}
      const before=JSON.stringify(DB);
      const M=R?mergeDB(DB,R):DB;
      const ms=JSON.stringify(M);
      let rev=SY.rev;
      if(ms!==remoteStr){
        let w=null;
        if(etag){try{w=await fbReq('PUT','dms/data',ms,{'if-match':etag})}catch(e){if(e instanceof TypeError)SY.etagOK=false;else throw e}}
        if(w&&w.status===412)continue;
        if(w&&!w.ok)throw await fbErr(w);
        if(!w)await fb('PUT','dms/data',ms);
        rev=uid('r');await fb('PUT','dms/rev',rev);
      }else{try{rev=await fb('GET','dms/rev')}catch(e){rev=null}if(!rev){rev=uid('r');try{await fb('PUT','dms/rev',rev)}catch(e){}}}
      DB=M;localStorage.setItem(LS_KEY,ms);initSnap();SY.rev=rev;SY.dirty=false;
      SY.last=nowISO();setSync('ok');
    if(ME){ME=user(ME.id);if(!ME||ME.active===false){alert('تم إيقاف حسابك أو حذفه.');sessionStorage.removeItem('dms-session');location.reload();return true}
      if(ms!==before&&!(opts&&opts.quiet))softRefresh()}
      return true;
    }
    throw new Error('تعذر الحفظ بسبب تعديلات متزامنة من أجهزة أخرى؛ ستُعاد المحاولة تلقائيًا.');
  }catch(e){setSync('err',e.message||String(e));return false}
  finally{SY.busy=false}
}

  if(!$('#modal').classList.contains('hidden'))return;
  const ae=document.activeElement;if(ae&&$('#main').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;

/* v2.4: حُذف تعريف قديم مكرر لـ allApps (التعريف الفعّال لاحقًا في الملف) */
function curVersion(k){const av=(DB.appVersions||{})[k];if(!av||!av.current)return null;return (av.history||[]).find(h=>h.vid===av.current)||null}
/* v2.4: حُذف تعريف قديم مكرر لـ systems (التعريف الفعّال لاحقًا في الملف) */
function noTranslate(t){t=t.replace(/<html([^>]*)>/i,(m,g)=>/translate=/.test(g)?m:'<html'+g+' translate="no">');return t.replace(/<head([^>]*)>/i,m=>m+'<meta name="google" content="notranslate">')}
async function builtinText(a){const el=document.getElementById('src-'+a);if(!el)return null;
  const bin=atob(el.textContent.trim());const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  if(el.dataset.enc==='gzip'){ /* v2.4: الأنظمة المدمجة مضغوطة gzip */
    if(typeof DecompressionStream==='undefined')return '<p style="font-family:sans-serif;padding:40px;text-align:center" dir="rtl">المتصفح قديم ولا يستطيع فتح الأنظمة المدمجة. حدّث المتصفح (Chrome أو Edge 80 فأحدث، Safari 16.4 فأحدث، Firefox 113 فأحدث).</p>';
    return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  return new TextDecoder('utf-8').decode(u8)}
async function versionText(a,vid){
  let t=await IDB.get('appv:'+vid).catch(()=>null);
  if(!t&&syncCfg()){try{t=await fb('GET','dms_apps/'+a+'_'+vid);if(t)await IDB.put('appv:'+vid,t)}catch(e){}}

async function appHtmlText(a){
  const v=curVersion(a);let t=null;
  if(v){t=await versionText(a,v.vid);if(!t)toast('تعذر تحميل الإصدار '+v.ver+' على هذا الجهاز؛ فُتح الإصدار الأصلي.')}
  if(!t){const old=await IDB.get('app:'+a).catch(()=>null);t=old||await builtinText(a)}
  if(!t)return '<p style="font-family:sans-serif;padding:40px;text-align:center" dir="rtl">ملف هذا النظام غير متوفر على هذا الجهاز بعد. تأكد من ربط الجهاز بقاعدة بيانات القسم.</p>';
  return noTranslate(t);
}
async function appHtmlBlob(a){return new Blob([await appHtmlText(a)],{type:'text/html;charset=utf-8'})}

  $('#toolBar').innerHTML=`<button class="btn sm" onclick="go('home')">الصفحة الرئيسية</button>
    <span class="small muted" style="flex:1">${esc(A.name)}${A.ver?' – الإصدار '+esc(A.ver):''} · ${esc(c.name)}</span>
    ${isAdmin()?`<button class="btn sm" onclick="go('settings',{st:'systems'})">رفع تحديث</button>`:''}

    f.srcdoc=await appHtmlText(a);FRAMES[a]=f;$('#toolFrames').appendChild(f);audit('فتح نظام',A.name,'',A.committee);save()}
  FRAMES[a].classList.add('on');
}
async function downloadApp(a){const b=await appHtmlBlob(a);const A=allApps()[a];const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download=A.name+(A.ver?' '+A.ver:'')+'.html';x.click()}
function detectVersion(name,text){
  const m=(name||'').match(/v?\s*(\d+(?:[._]\d+){0,3})(?!.*\d)/i)||((text||'').match(/(?:الإصدار|version|v)\s*[:\-]?\s*(\d+(?:\.\d+){1,3})/i));
  return m?m[1].replace(/_/g,'.'):'';
}

  modal('رفع تحديث: '+esc(A.name),`<div class="formgrid"><label class="f full">ملف النظام الجديد (HTML)<input type="file" id="upF" accept=".html,.htm" onchange="upPick(this.files[0])"></label>
   <label class="f">رقم الإصدار<input id="upV" placeholder="مثل 6.8"></label><label class="f">الإصدار الحالي<input value="${esc(A.ver||'—')}" disabled></label>

async function upPick(f){if(!f)return;const t=await f.slice(0,200000).text();const v=detectVersion(f.name.replace(/\.html?$/i,''),t);if(v&&!val('upV'))$('#upV').value=v}
async function doUploadVersion(k,fileArg,verArg,noteArg){
  if(!isAdmin()){alert('رفع الأنظمة وتحديثاتها من صلاحية المالك فقط.');return}
  const f=fileArg||($('#upF')&&$('#upF').files[0]);if(!f){$('#upErr').textContent='اختر ملف النظام.';return}
  const text=await f.text();if(!/<html|<!doctype/i.test(text)){$('#upErr').textContent='الملف ليس صفحة HTML.';return}
  let sha='غير متاحة';try{if(window.crypto&&crypto.subtle)sha=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))}catch(e){}
  if(!confirm('تنبيه أمني: ملف النظام يعمل داخل البرنامج بصلاحيات كاملة على بياناته، ويصل إلى كل الأجهزة المرتبطة. ارفع فقط ملفات من مصدر موثوق.\n\nبصمة الملف (SHA-256): '+sha.slice(0,24)+'…\n\nمتابعة؟'))return;
  const ver=verArg||val('upV')||detectVersion(f.name,text)||'بدون رقم';const note=noteArg!=null?noteArg:($('#upN')?$('#upN').value:'');
  const vid=uid('v');await IDB.put('appv:'+vid,text);
  if(syncCfg()){if($('#upErr'))$('#upErr').textContent='جارٍ رفع الملف للسحابة…';try{await fb('PUT','dms_apps/'+k+'_'+vid,text)}catch(e){if($('#upErr'))$('#upErr').textContent='تعذر الرفع للسحابة: '+e.message;return}}
  const av=DB.appVersions[k]=DB.appVersions[k]||{history:[]};av.history=av.history||[];
  av.history.push({vid,ver,file:f.name,size:f.size,sha,at:nowISO(),by:ME.id,note});av.current=vid;
  if(FRAMES[k]){FRAMES[k].remove();delete FRAMES[k]}
  audit('رفع تحديث نظام',allApps()[k].name,'الإصدار '+ver,allApps()[k].committee);save();closeModal();refresh();toast('تم تفعيل الإصدار '+ver);
}
function activateVersion(k,vid){const av=DB.appVersions[k]=DB.appVersions[k]||{history:[]};av.current=vid||null;if(FRAMES[k]){FRAMES[k].remove();delete FRAMES[k]}
  audit('تغيير إصدار نظام',allApps()[k].name,vid?(av.history.find(h=>h.vid===vid)||{}).ver:'الإصدار الأصلي');save();refresh();toast('تم تغيير الإصدار')}
async function deleteVersion(k,vid){const av=DB.appVersions[k];if(av.current===vid){alert('لا يمكن حذف الإصدار المفعّل. فعّل إصدارًا آخر أولًا.');return}if(!confirm('حذف هذا الإصدار نهائيًا؟'))return;
  av.history=av.history.filter(h=>h.vid!==vid);await IDB.del('appv:'+vid);if(syncCfg())fb('DELETE','dms_apps/'+k+'_'+vid).catch(()=>{});save();refresh()}

/* ===================== الرسوم البيانية ===================== */
const r1=v=>Math.round(v*10)/10;
function hbars(items,o){o=o||{};const max=o.max||Math.max(1,...items.map(i=>i.value));const unit=o.unit==null?'%':o.unit;
  if(!items.length)return '<div class="small muted">لا توجد بيانات.</div>';
  return `<div class="hb">${items.map(i=>`<div class="hb-row" title="${esc(i.label)}: ${r1(i.value)}${unit}"><span class="hb-l">${esc(i.label)}</span><span class="hb-t"><span class="hb-f" style="width:${Math.max(0,Math.min(100,i.value/max*100))}%;background:${i.color||'var(--ledger)'}"></span>${o.target!=null?`<span class="hb-tg" style="inset-inline-start:${o.target/max*100}%" title="المستهدف ${o.target}${unit}"></span>`:''}</span><span class="hb-v">${r1(i.value)}${unit}</span></div>${i.sub?`<div class="hb-sub">${esc(i.sub)}</div>`:''}`).join('')}</div>`}
function hstack(items,keys){if(!items.length)return '<div class="small muted">لا توجد بيانات.</div>';const max=Math.max(1,...items.map(i=>keys.reduce((a,k)=>a+(i[k.k]||0),0)));
  return `<div class="hb">${items.map(i=>{const tot=keys.reduce((a,k)=>a+(i[k.k]||0),0);return `<div class="hb-row"><span class="hb-l">${esc(i.label)}</span><span class="hb-t" style="display:flex">${keys.map(k=>`<span title="${k.l}: ${i[k.k]||0}" style="height:100%;width:${(i[k.k]||0)/max*100}%;background:${k.c}"></span>`).join('')}</span><span class="hb-v">${tot}</span></div>`}).join('')}</div>${legend(keys.map(k=>({label:k.l,color:k.c})))}`}
function legend(ls){return `<div class="lgd">${ls.map(l=>`<span><i style="background:${l.color}"></i>${esc(l.label)}${l.value!=null?` <b>${l.value}</b>`:''}</span>`).join('')}</div>`}
function donut(segs,center){const tot=segs.reduce((a,s)=>a+s.value,0);const R=46,C=2*Math.PI*R;let off=0;
  const arcs=tot?segs.filter(s=>s.value).map(s=>{const len=s.value/tot*C;const el=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(s.label)}: ${s.value}</title></circle>`;off+=len;return el}).join(''):`<circle r="${R}" cx="60" cy="60" fill="none" stroke="#E4E9E6" stroke-width="18"/>`;
  return `<div class="dn"><svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="${esc(center||'')}">${arcs}<text x="60" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${tot}</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="var(--ink2)">${esc(center||'')}</text></svg>${legend(segs)}</div>`}
function columns(labels,series){
  const W=560,H=210,pl=10,pr=30,pt=14,pb=34;let max=Math.max(4,...series.flatMap(s=>s.values));max=Math.ceil(max/4)*4;const n=labels.length;const gw=(W-pl-pr)/n;const bw=Math.min(22,(gw-10)/series.length);
  const y=v=>pt+(H-pt-pb)*(1-v/max);let g='';
  [0,.25,.5,.75,1].forEach(f=>{const yy=y(max*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E4E9E6"/><text x="${W-pr+4}" y="${yy+4}" font-size="10" fill="var(--ink2)">${Math.round(max*f)}</text>`});
  labels.forEach((lb,i)=>{const gx=W-pr-(i+1)*gw;series.forEach((s,j)=>{const v=s.values[i]||0;const x=gx+(gw-bw*series.length)/2+j*bw;g+=`<rect x="${x}" y="${y(v)}" width="${bw-2}" height="${H-pb-y(v)}" rx="2" fill="${s.color}"><title>${esc(s.name)} – ${esc(lb)}: ${v}</title></rect>${v?`<text x="${x+(bw-2)/2}" y="${y(v)-3}" font-size="9" text-anchor="middle" fill="var(--ink2)">${v}</text>`:''}`});
    g+=`<text x="${gx+gw/2}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="var(--ink2)">${esc(lb)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">${g}</svg>${legend(series.map(s=>({label:s.name,color:s.color})))}`}

/* ===================== لوحة رئيس القسم ===================== */
function pgHead(){
  if(!canHeadDash())return noAccess();
  const S=DB.settings,t0=today(),ts=DB.tasks.filter(t=>t.status!=='arch'),cs=DB.committees;
  const late=ts.filter(isLate),done=ts.filter(t=>t.status==='done'),pend=ts.filter(t=>t.status==='pend');
  const avg=ts.length?Math.round(ts.reduce((a,t)=>a+(t.status==='done'?100:(+t.progress||0)),0)/ts.length):0;
  const kp=DB.kpis,kpM=kp.filter(k=>k.actual!==''&&k.actual!=null),kpOk=kp.filter(kpiMet).length;
  const clos=DB.clo.map(m=>({m,c:cloCalc(m)})).filter(x=>x.c.n);
  const cloAvgs=clos.flatMap(x=>x.c.res.filter(Boolean).map(r=>r.avg));const cloAvg=cloAvgs.length?cloAvgs.reduce((a,b)=>a+b,0)/cloAvgs.length:null;
  const vUp=DB.visits.filter(v=>v.status==='plan'&&v.date>=t0);
  let h=`<div class="filters"><div style="flex:1"><h2 style="margin:0;font-family:var(--display)">لوحة رئيس القسم</h2><div class="small muted">${esc(S.dept)} – ${esc(S.college)} · ${esc(S.term)} · حتى ${fmtD(t0)}</div></div>
    ${syncCfg()?`<span class="small">${SY.last?'آخر مزامنة '+fmtDT(SY.last):''}</span>`:''}<button class="btn" onclick="printDoc('لوحة رئيس القسم',document.getElementById('headBody').innerHTML)">طباعة</button></div><div id="headBody">`;
  h+=`<div class="stats"><div><b>${avg}%</b><span>متوسط إنجاز القسم</span></div><div><b>${ts.length}</b><span>المهام</span></div><div><b class="good">${done.length}</b><span>مكتملة</span></div><div><b class="${late.length?'bad':''}">${late.length}</b><span>متأخرة</span></div><div><b style="color:var(--wait)">${pend.length}</b><span>بانتظار الاعتماد</span></div><div><b>${kp.length?Math.round(kpOk/kp.length*100)+'%':'—'}</b><span>تحقق المؤشرات (${kpOk}/${kp.length})</span></div><div><b class="${cloAvg!=null&&cloAvg<(S.cloTarget||75)?'bad':''}">${cloAvg!=null?r1(cloAvg)+'%':'—'}</b><span>متوسط تحقق المخرجات</span></div><div><b>${vUp.length}</b><span>زيارات قادمة</span></div></div>`;
  const cRows=cs.map(c=>{const s=commStats(c.id);return {label:c.name,value:s.avg,color:c.hex,sub:`${s.n} مهمة · ${s.done} مكتملة · ${s.late} متأخرة · ${membersOf(c.id).length} عضو`}});
  const st={not:0,prog:0,pend:0,done:0,late:0};ts.forEach(t=>{if(isLate(t))st.late++;else st[t.status]=(st[t.status]||0)+1});
  h+=`<div class="grid2"><div class="panel"><h3>إنجاز اللجان</h3><div class="body">${hbars(cRows,{max:100})}</div></div>
   <div class="panel"><h3>حالة المهام</h3><div class="body">${donut([{label:'مكتمل',value:st.done,color:'var(--ok)'},{label:'جاري',value:st.prog,color:'#2F6F9F'},{label:'يحتاج اعتماد',value:st.pend,color:'#C9962B'},{label:'لم يبدأ',value:st.not,color:'#AEB8B4'},{label:'متأخر',value:st.late,color:'var(--late)'}],'مهمة')}</div></div></div>`;
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7))}
  const mLbl=months.map(m=>new Date(m+'-01T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'short'}));
  const created=months.map(m=>ts.filter(t=>(t.createdAt||'').slice(0,7)===m).length),completed=months.map(m=>done.filter(t=>(t.approvedAt||t.updatedAt||'').slice(0,7)===m).length);
  const dueM=months.map(m=>ts.filter(t=>(t.end||'').slice(0,7)===m).length);
  const people=DB.users.filter(u=>ts.some(t=>t.assignee===u.id)).map(u=>{const l=ts.filter(t=>t.assignee===u.id);return {label:u.name,done:l.filter(t=>t.status==='done').length,open:l.filter(t=>t.status!=='done'&&!isLate(t)).length,late:l.filter(isLate).length}}).sort((a,b)=>(b.done+b.open+b.late)-(a.done+a.open+a.late)).slice(0,10);
  h+=`<div class="grid2"><div class="panel"><h3>حركة العمل آخر 6 أشهر</h3><div class="body">${columns(mLbl,[{name:'أُنشئت',color:'#AEB8B4',values:created},{name:'مستحقة',color:'#C9962B',values:dueM},{name:'اكتملت',color:'var(--ledger)',values:completed}])}</div></div>
   <div class="panel"><h3>أداء الأعضاء</h3><div class="body">${hstack(people,[{k:'done',l:'مكتملة',c:'var(--ok)'},{k:'open',l:'مفتوحة',c:'#9DB9CF'},{k:'late',l:'متأخرة',c:'var(--late)'}])}</div></div></div>`;
  const kc=cs.map(c=>{const l=kp.filter(k=>k.committee===c.id);return {label:c.name,ok:l.filter(kpiMet).length,no:l.filter(k=>k.actual!==''&&k.actual!=null&&!kpiMet(k)).length,na:l.filter(k=>k.actual===''||k.actual==null).length}}).filter(x=>x.ok+x.no+x.na);
  const cloRows=clos.slice(-8).map(x=>{const r=x.c.res.filter(Boolean);const a=r.reduce((s,y)=>s+y.avg,0)/r.length;return {label:(x.m.courseName||'—')+(x.m.section?' ('+x.m.section+')':''),value:a,color:a>=x.m.target?'var(--ok)':'var(--late)',sub:x.c.res.map((y,j)=>y?`م${j+1}: ${r1(y.avg)}%`:'').filter(Boolean).join(' · ')}});
  h+=`<div class="grid2"><div class="panel"><h3>تحقق مخرجات التعلم حسب المقرر<span class="sp"></span><span class="small muted">الخط = المستهدف ${S.cloTarget||75}%</span></h3><div class="body">${hbars(cloRows,{max:100,target:S.cloTarget||75})}</div></div>
   <div class="panel"><h3>مؤشرات الأداء حسب اللجنة</h3><div class="body">${hstack(kc,[{k:'ok',l:'محقق',c:'var(--ok)'},{k:'no',l:'غير محقق',c:'var(--late)'},{k:'na',l:'لم يُقس',c:'#C9D0CD'}])}</div></div></div>`;
  const hz=+S.upcomingDays*2||30;
  const agenda=[...ts.filter(t=>t.status!=='done'&&t.end&&t.end>=t0&&daysBetween(t0,t.end)<=hz).map(t=>({d:t.end,t:t.title,c:t.committee,k:'مهمة',who:uname(t.assignee)})),
    ...DB.visits.filter(v=>v.status==='plan'&&v.date>=t0&&daysBetween(t0,v.date)<=hz).map(v=>({d:v.date,t:v.title,c:'receptions',k:'زيارة',who:v.guest}))].sort((a,b)=>a.d.localeCompare(b.d)).slice(0,12);
  const since=new Date(Date.now()-30*864e5).toISOString();const use={};DB.log.filter(l=>l.action==='فتح نظام'&&l.at>=since).forEach(l=>use[l.entity]=(use[l.entity]||0)+1);
  const A=allApps();

/* ---------- أمان: PBKDF2 + قفل المحاولات + انتهاء الجلسة ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashV1(user,pass){const txt='dms|'+user.toLowerCase()+'|'+pass;
  if(window.crypto&&crypto.subtle)return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)));
  let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))|0;return 'w'+(h>>>0).toString(16)}
async function pbkdf2(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:150000},k,256))}
async function hash(user,pass){
  if(!(window.crypto&&crypto.subtle))return hashV1(user,pass);
  const salt=hex(crypto.getRandomValues(new Uint8Array(16)));return 'p2$'+salt+'$'+await pbkdf2(pass,salt);
}
async function verifyPass(u,pass){
  if(!u||!u.pass)return false;
  if(u.pass.startsWith('p2$')){const [,salt,h]=u.pass.split('$');return (await pbkdf2(pass,salt))===h}
  const ok=u.pass===await hashV1(u.username,pass);
  if(ok&&window.crypto&&crypto.subtle){u.pass=await hash(u.username,pass);save()}
  return ok;
}

STATUS.ret='معادة للتعديل';STATUS.arch='مؤرشفة';
function statusPill(t){
  if(isLate(t))return `<span class="pill st-late">متأخر</span>`;
  const m={not:'st-not',prog:'st-prog',pend:'st-pend',done:'st-done',ret:'st-ret',arch:'st-not'};
  return `<span class="pill ${m[t.status]||'st-not'}">${STATUS[t.status]||'—'}</span>`;
}
function isLate(t){return t.status!=='done'&&t.status!=='arch'&&t.end&&t.end<today()}
function visibleTasks(){return DB.tasks.filter(t=>t.status!=='arch'&&roleIn(t.committee))}
function commStats(cid){
  const ts=DB.tasks.filter(t=>t.committee===cid&&t.status!=='arch');
  const n=ts.length,done=ts.filter(t=>t.status==='done').length,late=ts.filter(isLate).length,pend=ts.filter(t=>t.status==='pend').length;
  const avg=n?Math.round(ts.reduce((a,t)=>a+(t.status==='done'?100:(+t.progress||0)),0)/n):0;
  return {n,done,late,pend,avg,prog:ts.filter(t=>t.status==='prog'||t.status==='ret').length};
}
const WF=[['create','إنشاء'],['assign','إسناد'],['work','تنفيذ'],['evidence','رفع الدليل'],['review','مراجعة'],['approve','اعتماد وإغلاق'],['arch','أرشفة']];
function wfStage(t){if(t.status==='arch')return 6;if(t.status==='done')return 5;if(t.status==='pend')return 4;if((t.files||[]).length)return 3;if(t.status==='prog'||t.status==='ret'||+t.progress>0)return 2;if(t.assignee)return 1;return 0}
function wfBar(t){const s=wfStage(t);return `<div class="wf">${WF.map(([k,l],i)=>`<span class="${i<s?'d':i===s?'c':''}${t.status==='ret'&&i===2?' r':''}">${l}</span>`).join('')}</div>`}

function taskCommChanged(){const c=val('tkComm');const as=isChair(c)?membersOf(c):[ME];$('#tkAs').innerHTML=opt(as.map(u=>({v:u.id,l:u.name})),ME.id);$('#tkInit').innerHTML=opt(initiativesFor(c).map(i=>({v:i.id,l:i.title})),'','— غير مرتبطة —')}
function saveTask(id,mode){
  const title=val('tkTitle');if(!title){alert('اكتب اسم المهمة.');return}
  const start=val('tkStart'),end=val('tkEnd');if(start&&end&&end<start){alert('تاريخ النهاية قبل تاريخ البداية.');return}
  let t=id?DB.tasks.find(x=>x.id===id):null;const isNew=!t;
  if(isNew){t={id:uid('t'),committee:val('tkComm'),files:[],comments:[],createdBy:ME.id,createdAt:nowISO(),term:DB.settings.term};}
  const chair=isChair(t.committee);
  if(mode==='submit'&&t.ev&&!(t.files||[]).length){alert('هذه المهمة تشترط إرفاق دليل قبل إرسالها للاعتماد.');return}
  if(isNew)DB.tasks.push(t);
  const b={s:t.status,p:t.progress,e:t.end,a:t.assignee};
  const newStatus=val('tkStatus')||'not';
  Object.assign(t,{title,assignee:$('#tkAs').disabled?t.assignee:(val('tkAs')||ME.id),start,end,status:newStatus,priority:val('tkPri'),progress:+$('#tkProg').value,notes:$('#tkNotes').value,initiative:val('tkInit'),updatedAt:nowISO(),updatedBy:ME.id});
  if(chair)t.ev=$('#tkEv').checked;
  if(t.status==='done'){t.progress=100;if(!t.approvedBy){t.approvedBy=ME.id;t.approvedAt=nowISO()}}else{t.approvedBy=null;t.approvedAt=null}
  if(mode==='submit'){t.status='pend';t.submittedAt=nowISO();t.comments.push({by:ME.id,at:nowISO(),text:'أُرسلت للاعتماد بنسبة إنجاز '+t.progress+'%'});notify(chairsOf(t.committee),'مهمة بانتظار اعتمادك: '+t.title,{kind:'task',id:t.id})}
  if(t.progress>0&&t.status==='not')t.status='prog';
  if((isNew||b.a!==t.assignee)&&t.assignee!==ME.id)notify([t.assignee],'أُسندت إليك مهمة: '+t.title+(t.end?' (تنتهي '+fmtD(t.end)+')':''),{kind:'task',id:t.id});
  const ch=[];if(!isNew){if(b.s!==t.status)ch.push('الحالة: '+(STATUS[b.s]||'')+' ← '+STATUS[t.status]);if(b.p!=t.progress)ch.push('الإنجاز: '+(b.p||0)+'% ← '+t.progress+'%');if(b.e!==t.end)ch.push('النهاية ← '+t.end);if(b.a!==t.assignee)ch.push('المسؤول ← '+uname(t.assignee))}
  audit(isNew?'أنشأ مهمة':mode==='submit'?'أرسل للاعتماد':'عدّل مهمة',t.title,ch.join('، '),t.committee);

const EV_TYPES=['اجتماع','اختبار','فعالية','موعد تسليم','إجازة','أخرى'];
function calItems(from,to){const out=[];const inR=d=>d&&d>=from&&d<=to;
  visibleTasks().forEach(t=>{if(inR(t.end))out.push({d:t.end,t:t.title,c:t.committee,k:'task',id:t.id,late:isLate(t),done:t.status==='done'})});
  if(roleInType('receptions'))DB.visits.forEach(v=>{if(inR(v.date)&&v.status!=='cancel')out.push({d:v.date,t:v.title,c:'receptions',k:'visit',id:v.id,time:v.time})});
  DB.events.forEach(e=>{if(inR(e.date)&&(!e.committee||roleIn(e.committee)))out.push({d:e.date,t:e.title,c:e.committee,k:'event',id:e.id,time:e.time,type:e.type})});
  DB.initiatives.forEach(i=>{if(inR(i.end)&&roleIn(i.committee))out.push({d:i.end,t:'نهاية مبادرة: '+i.title,c:i.committee,k:'init',id:i.id})});
  return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''));}
function pgCalendar(){
  const ym=VIEW.ym||today().slice(0,7);const [Y,M]=ym.split('-').map(Number);
  const first=new Date(Y,M-1,1),days=new Date(Y,M,0).getDate();const pad=first.getDay();
  const iso=d=>`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const items=calItems(iso(1),iso(days));const shift=k=>{const d=new Date(Y,M-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  const title=first.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'});
  let h=`<div class="filters"><button class="btn" onclick="go('calendar',{ym:'${shift(-1)}'})">الشهر السابق</button><h2 style="margin:0 8px;font-size:20px;min-width:auto">${title}</h2><button class="btn" onclick="go('calendar',{ym:'${shift(1)}'})">الشهر التالي</button><button class="btn" onclick="go('calendar')">اليوم</button><span style="flex:1"></span><button class="btn primary" onclick="openEvent(null,'${ym===today().slice(0,7)?today():iso(1)}')">حدث جديد</button></div>`;
  h+=`<div class="panel cal"><div class="cal-h">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-g">`;
  for(let i=0;i<pad;i++)h+='<div class="cal-d x"></div>';
  for(let d=1;d<=days;d++){const ds=iso(d);const its=items.filter(x=>x.d===ds);
    h+=`<div class="cal-d${ds===today()?' today':''}" ondblclick="openEvent(null,'${ds}')"><span class="cal-n">${d}</span>${its.slice(0,4).map(x=>`<a class="cal-i${x.late?' late':''}${x.done?' done':''}" style="--c:${x.c?comm(x.c).hex:'#5B6B66'}" onclick="calOpen('${x.k}','${x.id}')" title="${esc(x.t)}">${x.time?esc(x.time)+' ':''}${esc(x.t)}</a>`).join('')}${its.length>4?`<span class="small muted">+${its.length-4} أخرى</span>`:''}</div>`}
  h+=`</div></div><div class="lgd">${DB.committees.map(c=>`<span><i style="background:${c.hex}"></i>${esc(c.name)}</span>`).join('')}<span><i style="background:#5B6B66"></i>عام</span><span class="small">انقر مرتين على أي يوم لإضافة حدث</span></div>`;
  return h;
}
function calOpen(k,id){if(k==='task')openTask(id);else if(k==='visit')openVisit(id);else if(k==='event')openEvent(id);else if(k==='init')go('plan')}
function openEvent(id,date){const e=id?DB.events.find(x=>x.id===id):{title:'',date:date||today(),time:'',committee:'',type:'اجتماع',place:'',notes:''};
  const can=!id||e.createdBy===ME.id||isAdmin()||ME.head||(e.committee&&isChair(e.committee));const ro=can?'':'disabled';
  const cs=[{v:'',l:'عام للقسم'}].concat(myCommittees().map(c=>({v:c.id,l:c.name})));

   can?`<button class="btn primary" onclick="saveEvent(${id?`'${id}'`:'null'})">حفظ الحدث</button><span class="sp"></span>${id?`<button class="btn danger" onclick="delEvent('${id}')">حذف</button>`:''}`:'')}
function saveEvent(id){if(!val('evT')||!val('evD')){alert('اكتب العنوان والتاريخ.');return}let e=id?DB.events.find(x=>x.id===id):null;const n=!e;if(n){e={id:uid('e'),createdBy:ME.id,createdAt:nowISO()};DB.events.push(e)}
